<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>十七商店 整備レポート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#e2e7ee; --line:#d7dee6;
  --ink:#16202c; --ink-dim:#5b6676; --accent:#1f3f66; --accent-ink:#ffffff;
  --good:#2f7a63; --warn:#b8742a; --radius:14px; --radius-lg:22px;
  --font-display:'Zen Kaku Gothic New',"Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:'Zen Kaku Gothic New',"Hiragino Sans","Noto Sans JP",sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);}
body{color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3{font-family:var(--font-display);font-weight:900;letter-spacing:.01em;margin:0;}
p{margin:0;}
button{font-family:inherit;}
img{max-width:100%;}

#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;}

.topbar{padding-block:4px 18px;}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:600;}
.topbar h1{font-size:26px;margin-top:6px;color:var(--ink);}
.topbar .sub{color:var(--ink-dim);font-size:13.5px;margin-top:6px;}

.state-box{margin-top:24px;padding:20px;border:1px solid var(--line);border-radius:var(--radius-lg);
  background:var(--surface);color:var(--ink-dim);font-size:13px;line-height:1.7;}
.state-box.error{border-color:#c0523f;color:#c0523f;}

.store-list{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.store-card{text-align:left;display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px;cursor:pointer;width:100%;color:inherit;}
.store-card:active{transform:scale(.99);}
.store-card .store-mark{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:13px;flex:none;}
.store-card .store-info{flex:1;min-width:0;}
.store-card .store-info h3{font-size:16px;}
.store-card .store-info .addr{color:var(--ink-dim);font-size:12px;margin-top:3px;}
.store-card .store-info .meta-row{display:flex;gap:10px;margin-top:7px;font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);flex-wrap:wrap;}
.store-card .chev{color:var(--ink-dim);flex:none;font-size:18px;}
.store-card.empty .store-info .meta-row{color:var(--warn);}

.detail-header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-block:6px 10px;margin-bottom:4px;}
.back-btn{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;padding:4px 0 10px;cursor:pointer;}
.detail-header h1{font-size:21px;}
.meta{display:flex;flex-direction:column;gap:3px;margin-top:8px;font-size:12px;color:var(--ink-dim);}
.meta .row span.k{font-family:var(--font-mono);color:var(--ink-dim);margin-right:8px;}
.meta .row span.v{color:var(--ink);}

.date-picker{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none;}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none;}
.chips::-webkit-scrollbar,.date-picker::-webkit-scrollbar{display:none;}
.chip{flex:none;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-dim);cursor:pointer;}
.chip.is-active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

.type-tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;margin-top:14px;}
.type-tabs[hidden]{display:none;}
.type-tab{flex:1;text-align:center;padding:9px 6px;border:none;background:transparent;border-radius:9px;
  font-size:12.5px;font-weight:700;color:var(--ink-dim);cursor:pointer;}
.type-tab.is-active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18);}

.item-list{display:flex;flex-direction:column;gap:24px;margin-top:6px;}
.item-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px;}
.item-card[hidden]{display:none;}
.item-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.item-no{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);}
.item-head h3{font-size:16px;flex:1;min-width:0;}
.cat-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;flex:none;}
.cat-badge.cat-kitchen{background:#f3e3cf;color:#7a4a12;}
.cat-badge.cat-hvac{background:#dde8f3;color:#1f4d7a;}
.cat-badge.cat-shop{background:#e2ecdf;color:#355c2c;}
.cat-badge.cat-other{background:var(--surface-2);color:var(--ink-dim);}

.compare{position:relative;width:100%;height:210px;border-radius:12px;overflow:hidden;background:var(--surface-2);touch-action:pan-y;}
.compare[data-before]{cursor:ew-resize;}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none;}
.compare.cmp-contain img{object-fit:contain;}
.compare .cmp-after{clip-path:inset(0 50% 0 0);}
.compare .cmp-range{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none;
  -webkit-appearance:none;appearance:none;background:transparent;}
.compare .cmp-handle{position:absolute;top:0;bottom:0;left:50%;width:0;pointer-events:none;}
.compare .cmp-handle::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);}
.compare .cmp-handle::after{content:"⇔";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;
  background:#fff;color:#16202c;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.compare .cmp-tag{position:absolute;top:8px;padding:3px 8px;font:600 10.5px/1 var(--font-mono);letter-spacing:.04em;border-radius:999px;background:rgba(10,16,24,.62);color:#fff;}
.compare .cmp-tag--before{left:8px;}
.compare .cmp-tag--after{right:8px;}
.compare .cmp-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;
  color:var(--ink-dim);font-size:11.5px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface-2);}

.media-fallback{display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;
  background:var(--surface-2);color:var(--ink-dim);font-size:11.5px;line-height:1.6;}
.compare .media-fallback{position:absolute;inset:0;}
.gal-track .media-fallback{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;}

.gallery{position:relative;width:100%;height:210px;border-radius:12px;overflow:hidden;background:var(--surface-2);}
.gallery.gal-contain{height:min(58vh,520px);}
.gallery .gal-track{display:flex;height:100%;width:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x pan-y;}
.gallery .gal-track::-webkit-scrollbar{display:none;}
.gallery .gal-track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;scroll-snap-stop:always;display:block;}
.gallery.gal-contain .gal-track img{object-fit:contain;}
.gallery .gal-count{position:absolute;top:8px;right:8px;padding:3px 8px;font:600 10.5px/1 var(--font-mono);letter-spacing:.04em;
  border-radius:999px;background:rgba(10,16,24,.62);color:#fff;pointer-events:none;}
.gallery .gal-nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;
  background:rgba(10,16,24,.55);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;cursor:pointer;}
.gallery .gal-prev{left:8px;}
.gallery .gal-next{right:8px;}
.gallery .gal-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none;}
.gallery .gal-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);}
.gallery .gal-dots span.is-active{background:#fff;}

.item-section{display:flex;flex-direction:column;gap:16px;}
.item-section-title{font-size:13px;font-weight:700;color:var(--ink-dim);letter-spacing:.02em;margin:0;
  padding-bottom:6px;border-bottom:1px solid var(--line);}

.item-foot{display:flex;align-items:center;justify-content:flex-end;margin-top:9px;}
.expand-btn{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 0;}
@media (max-width:719px){ .item-foot{display:none;} .compare[data-before], .gallery{cursor:pointer;} }
.remark{margin-top:10px;font-size:12.5px;line-height:1.7;color:var(--ink-dim);padding-top:10px;border-top:1px solid var(--line);white-space:pre-line;}

.lightbox{position:fixed;inset:0;background:rgba(6,10,15,.94);z-index:50;display:flex;flex-direction:column;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);}
.lightbox[hidden]{display:none;}
.lightbox{touch-action:pan-y;}
.lb-top{display:flex;justify-content:flex-end;max-width:520px;width:100%;margin:0 auto;}
.lb-close{background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;}
.lb-content{max-width:520px;width:100%;margin:10px auto 0;color:#fff;}
.lb-content .compare{height:min(52vh,480px);}
.lb-cat{display:inline-block;margin-top:14px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14);}
.lb-content h2{font-size:19px;margin-top:8px;color:#fff;}
.lb-content .remark{color:rgba(255,255,255,.72);border-top:1px solid rgba(255,255,255,.18);}

@media (max-width:360px){ .compare{height:180px;} }

@media (min-width:720px){
  #app{max-width:1040px;}
  .store-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
  .item-section{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;align-items:start;}
  .item-section-title{grid-column:1/-1;}
  .lb-top, .lb-content{max-width:1100px;}
  .lb-content .compare{height:min(78vh,860px);}
  .gallery.gal-contain{height:min(78vh,860px);}
}

[hidden]{display:none!important;}
</style>
</head>
<body>
<div id="app">

  <div id="view-list" class="view">
    <header class="topbar">
      <div class="eyebrow">LIFE MARK&apos;S</div>
      <h1>整備・清掃レポート</h1>
      <p class="sub">店舗を選択してください</p>
    </header>
    <div id="listState"></div>
    <div class="store-list" id="storeList"></div>
  </div>

  <div id="view-store" class="view" hidden>
    <header class="detail-header">
      <button class="back-btn" id="backBtn">← 店舗一覧に戻る</button>
      <h1 id="storeName"></h1>
      <div class="meta" id="storeMeta"></div>
    </header>
    <div class="date-picker" id="datePicker" hidden></div>
    <div class="type-tabs" id="typeTabs" hidden></div>
    <div class="chips" id="filterChips"></div>
    <div id="storeState"></div>
    <div class="item-list" id="itemList"></div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <div class="lb-top"><button class="lb-close" id="lbClose" aria-label="閉じる">×</button></div>
    <div class="lb-content">
      <div id="lbCompare"></div>
      <span class="lb-cat" id="lbCat"></span>
      <h2 id="lbTitle"></h2>
      <p class="remark" id="lbRemark"></p>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---- configuration ----
  var SHEET_ID = "1_7A8RLKN_VepWP8bS6Nn9AGyZA-QSd6VnD2s8CoQD-c";
  var API_KEY  = "AIzaSyC3fxmpefcGxRs8WADoAC3PV45Lhln12sg"; // same key as the KPI dashboard

  var CATS = {"厨房":{key:"kitchen"}, "空調":{key:"hvac"}, "店舗":{key:"shop"}};
  function catKey(label){ return (CATS[label] && CATS[label].key) || "other"; }

  var STORES = [];
  var ITEMS = [];
  var currentStore = null;
  var currentDate = null;

  var viewList = document.getElementById("view-list");
  var viewStore = document.getElementById("view-store");
  var storeListEl = document.getElementById("storeList");
  var listStateEl = document.getElementById("listState");
  var storeStateEl = document.getElementById("storeState");
  var itemListEl = document.getElementById("itemList");
  var chipsEl = document.getElementById("filterChips");
  var typeTabsEl = document.getElementById("typeTabs");
  var datePickerEl = document.getElementById("datePicker");
  var currentCatFilter = "all";
  var currentTypeFilter = "すべて";

  function typeKey(item){ return (item.item_type || "").trim() || "その他"; }
  // Display labels for the item_type tabs/section headers — the sheet keeps using
  // the short "共通"/"個別" values, but the UI shows the friendlier full names.
  var TYPE_LABELS = { "共通": "共通項目", "個別": "店舗別項目" };
  function typeLabel(key){ return TYPE_LABELS[key] || key; }
  var lightbox = document.getElementById("lightbox");

  // ---- helpers ----
  function rowsToObjects(rows){
    if(!rows || !rows.length) return [];
    var header = rows[0];
    return rows.slice(1).filter(function(r){ return r && r.length && r[0]; }).map(function(r){
      var obj = {};
      header.forEach(function(h,i){ obj[h] = r[i] !== undefined ? r[i] : ""; });
      return obj;
    });
  }

  function driveImg(url){
    if(!url) return null;
    url = String(url).trim();
    if(!url || url.indexOf("PASTE_") === 0) return null;
    var m = url.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
    if(m) return "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1000";
    if(/^https?:\/\//.test(url)) return url;
    return null;
  }

  function parsePhotos(item){
    var raw = item.photo_urls || "";
    return raw.split(/[,\n]/).map(function(s){ return driveImg(s); }).filter(Boolean);
  }

  window.handleImgError = function(img){
    if(img.dataset.failed) return;
    img.dataset.failed = "1";
    var fb = document.createElement("div");
    fb.className = (img.className ? img.className + " " : "") + "media-fallback";
    fb.textContent = "画像を読み込めません";
    img.replaceWith(fb);
  };

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // ---- data load ----
  async function loadData(){
    listStateEl.innerHTML = '<div class="state-box">読み込み中です…</div>';
    var ranges = ["stores!A1:Z2000","items!A1:Z2000"].map(function(r){
      return "ranges=" + encodeURIComponent(r);
    }).join("&");
    var url = "https://sheets.googleapis.com/v4/spreadsheets/" + SHEET_ID + "/values:batchGet?" + ranges + "&key=" + API_KEY;
    try{
      var res = await fetch(url);
      if(!res.ok) throw new Error("HTTP " + res.status);
      var json = await res.json();
      var vr = json.valueRanges || [];
      STORES = rowsToObjects((vr[0]||{}).values);
      ITEMS = rowsToObjects((vr[1]||{}).values);
      listStateEl.innerHTML = "";
      renderStores();
    }catch(err){
      listStateEl.innerHTML = '<div class="state-box error">データの読み込みに失敗しました。スプレッドシートの共有設定（リンクを知っている全員が閲覧可）と、Google Cloud ConsoleのAPIキーの許可ドメインに現在のサイトを追加しているかご確認ください。<br><br>詳細: ' + esc(err.message) + '</div>';
    }
  }

  function itemsForStore(storeId){
    return ITEMS.filter(function(it){ return it.store_id === storeId; });
  }

  function visitDatesForStore(storeId){
    var set = {};
    itemsForStore(storeId).forEach(function(it){ if(it.visit_date) set[it.visit_date] = true; });
    return Object.keys(set).sort().reverse();
  }

  // ---- store list ----
  function renderStores(){
    var activeStores = STORES.filter(function(s){ return String(s.active).toUpperCase() !== "FALSE"; });
    if(!activeStores.length){
      listStateEl.innerHTML = '<div class="state-box">店舗がまだ登録されていません。スプレッドシートの「stores」シートに行を追加してください。</div>';
      storeListEl.innerHTML = "";
      return;
    }
    storeListEl.innerHTML = activeStores.map(function(s, idx){
      var dates = visitDatesForStore(s.store_id);
      var count = itemsForStore(s.store_id).length;
      var mark = esc((s.store_name||s.store_id||"?").slice(0,2));
      if(!dates.length){
        return '<button class="store-card empty" data-store="'+esc(s.store_id)+'">'+
          '<div class="store-mark">'+mark+'</div>'+
          '<div class="store-info">'+
            '<h3>'+esc(s.store_name)+'</h3>'+
            '<div class="addr">'+esc(s.address||"")+'</div>'+
            '<div class="meta-row"><span>実績はまだありません</span></div>'+
          '</div>'+
          '<div class="chev">›</div>'+
        '</button>';
      }
      return '<button class="store-card" data-store="'+esc(s.store_id)+'">'+
        '<div class="store-mark">'+mark+'</div>'+
        '<div class="store-info">'+
          '<h3>'+esc(s.store_name)+'</h3>'+
          '<div class="addr">'+esc(s.address||"")+'</div>'+
          '<div class="meta-row"><span>担当: '+esc(s.staff||"-")+'</span><span>最終実施: '+esc(dates[0])+'</span><span>'+itemsForStore(s.store_id).filter(function(it){return it.visit_date===dates[0];}).length+'項目</span></div>'+
        '</div>'+
        '<div class="chev">›</div>'+
      '</button>';
    }).join("");

    storeListEl.querySelectorAll(".store-card").forEach(function(btn){
      btn.addEventListener("click", function(){ openStore(btn.getAttribute("data-store")); });
    });
  }

  // ---- store detail ----
  function openStore(storeId){
    var store = STORES.filter(function(s){ return s.store_id === storeId; })[0];
    if(!store) return;
    currentStore = storeId;

    document.getElementById("storeName").textContent = store.store_name || storeId;
    document.getElementById("storeMeta").innerHTML =
      '<div class="row"><span class="k">住所</span><span class="v">'+esc(store.address||"-")+'</span></div>'+
      '<div class="row"><span class="k">担当者</span><span class="v">'+esc(store.staff||"-")+'</span></div>';

    var dates = visitDatesForStore(storeId);
    if(!dates.length){
      storeStateEl.innerHTML = '<div class="state-box" style="margin-top:14px;">この店舗の実施実績はまだ登録されていません。「items」シートに行を追加すると、ここに表示されます。</div>';
      itemListEl.innerHTML = "";
      chipsEl.innerHTML = "";
      datePickerEl.hidden = true;
      datePickerEl.innerHTML = "";
    }else{
      storeStateEl.innerHTML = "";
      currentDate = dates[0];
      if(dates.length > 1){
        datePickerEl.hidden = false;
        datePickerEl.innerHTML = dates.map(function(d,i){
          return '<button class="chip'+(i===0?" is-active":"")+'" data-date="'+esc(d)+'">'+esc(d)+'</button>';
        }).join("");
        datePickerEl.querySelectorAll(".chip").forEach(function(chip){
          chip.addEventListener("click", function(){
            datePickerEl.querySelectorAll(".chip").forEach(function(c){c.classList.remove("is-active");});
            chip.classList.add("is-active");
            currentDate = chip.getAttribute("data-date");
            currentCatFilter = "all";
            currentTypeFilter = "すべて";
            renderTypeTabs();
            renderChips();
            renderItems();
          });
        });
      }else{
        datePickerEl.hidden = true;
        datePickerEl.innerHTML = "";
      }
      currentCatFilter = "all";
      currentTypeFilter = "すべて";
      renderTypeTabs();
      renderChips();
      renderItems();
    }

    viewList.hidden = true;
    viewStore.hidden = false;
    window.scrollTo(0,0);
  }

  function renderChips(){
    var cats = ["all","kitchen","hvac","shop","other"];
    var labels = {all:"すべて",kitchen:"厨房",hvac:"空調",shop:"店舗",other:"その他"};
    var present = {};
    itemsForStore(currentStore).forEach(function(it){ present[catKey(it.category)] = true; });
    var list = cats.filter(function(c){ return c==="all" || present[c]; });
    chipsEl.innerHTML = list.map(function(c){
      return '<button class="chip'+(c==="all"?" is-active":"")+'" data-cat="'+c+'">'+labels[c]+'</button>';
    }).join("");
    chipsEl.querySelectorAll(".chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        chipsEl.querySelectorAll(".chip").forEach(function(c){c.classList.remove("is-active");});
        chip.classList.add("is-active");
        currentCatFilter = chip.getAttribute("data-cat");
        applyFilters();
      });
    });
  }

  // "共通"/"個別" (or whatever labels are used in the sheet) as a tab row, so the
  // distinction is a clear top-level switch rather than just a section heading.
  function renderTypeTabs(){
    var order = []; var seen = {};
    itemsForStore(currentStore).filter(function(it){ return it.visit_date === currentDate; }).forEach(function(it){
      var k = typeKey(it);
      if(!seen[k]){ seen[k] = true; order.push(k); }
    });
    if(order.length <= 1){
      typeTabsEl.hidden = true;
      typeTabsEl.innerHTML = "";
      return;
    }
    typeTabsEl.hidden = false;
    var tabs = ["すべて"].concat(order);
    typeTabsEl.innerHTML = tabs.map(function(t){
      var label = t === "すべて" ? t : typeLabel(t);
      return '<button class="type-tab'+(t===currentTypeFilter?" is-active":"")+'" data-type="'+esc(t)+'">'+esc(label)+'</button>';
    }).join("");
    typeTabsEl.querySelectorAll(".type-tab").forEach(function(btn){
      btn.addEventListener("click", function(){
        typeTabsEl.querySelectorAll(".type-tab").forEach(function(c){ c.classList.remove("is-active"); });
        btn.classList.add("is-active");
        currentTypeFilter = btn.getAttribute("data-type");
        applyFilters();
      });
    });
  }

  function applyFilters(){
    itemListEl.querySelectorAll(".item-section").forEach(function(section){
      var typeOk = currentTypeFilter === "すべて" || section.getAttribute("data-type") === currentTypeFilter;
      if(!typeOk){ section.hidden = true; return; }
      var anyVisible = false;
      section.querySelectorAll(".item-card").forEach(function(card){
        var show = (currentCatFilter==="all" || card.getAttribute("data-cat")===currentCatFilter);
        card.hidden = !show;
        if(show) anyVisible = true;
      });
      section.hidden = !anyVisible;
    });
  }

  // photos.length === 2 → Before/After compare slider (the common case).
  // photos.length === 0 → placeholder. Anything else → swipeable gallery.
  function mediaMarkup(item, extraClass, mode){
    var photos = parsePhotos(item);
    var name = esc(item.item_name);

    if(photos.length === 0){
      return '<div class="compare '+(extraClass||'')+'"><div class="cmp-placeholder">写真未登録</div></div>';
    }

    if(photos.length === 2){
      return '<div class="compare '+(extraClass||'')+'" data-before="1">'+
        '<img class="cmp-before" src="'+esc(photos[0])+'" alt="'+name+' Before" loading="lazy" onerror="handleImgError(this)">'+
        '<img class="cmp-after" src="'+esc(photos[1])+'" alt="'+name+' After" loading="lazy" onerror="handleImgError(this)">'+
        '<input class="cmp-range" type="range" min="0" max="100" value="50" aria-label="Before After 比較">'+
        '<div class="cmp-handle"></div>'+
        '<span class="cmp-tag cmp-tag--before">BEFORE</span>'+
        '<span class="cmp-tag cmp-tag--after">AFTER</span>'+
      '</div>';
    }

    var contain = mode === "lightbox";

    if(photos.length === 1){
      return '<div class="compare '+(contain?'cmp-contain':'')+'">'+
        '<img src="'+esc(photos[0])+'" alt="'+name+'" loading="lazy" onerror="handleImgError(this)"></div>';
    }

    // 3+: swipeable gallery with nav arrows + dots (scroll-snap also makes it touch-swipeable)
    var imgs = photos.map(function(p){
      return '<img src="'+esc(p)+'" alt="'+name+'" loading="lazy" onerror="handleImgError(this)">';
    }).join("");
    var dots = photos.map(function(_, i){
      return '<span class="'+(i===0?"is-active":"")+'"></span>';
    }).join("");
    return '<div class="gallery'+(contain?' gal-contain':'')+'">'+
      '<div class="gal-track">'+imgs+'</div>'+
      '<button type="button" class="gal-nav gal-prev" aria-label="前の写真">‹</button>'+
      '<button type="button" class="gal-nav gal-next" aria-label="次の写真">›</button>'+
      '<span class="gal-count">1/'+photos.length+'</span>'+
      '<div class="gal-dots">'+dots+'</div>'+
    '</div>';
  }

  // onTap (optional) fires for a plain touch tap on the image area — i.e. the
  // pointer didn't move enough to count as a swipe and didn't land on the nav
  // buttons — so the main item list can open the lightbox on mobile without a
  // separate "拡大表示" button to tap.
  function wireGallery(root, onTap){
    root.querySelectorAll(".gallery").forEach(function(gal){
      if(gal.dataset.wired) return;
      gal.dataset.wired = "1";
      var track = gal.querySelector(".gal-track");
      var imgs = track.querySelectorAll("img");
      var count = gal.querySelector(".gal-count");
      var dots = gal.querySelectorAll(".gal-dots span");
      var prev = gal.querySelector(".gal-prev");
      var next = gal.querySelector(".gal-next");

      function currentIndex(){
        return Math.round(track.scrollLeft / track.clientWidth) || 0;
      }
      function update(){
        var idx = Math.max(0, Math.min(imgs.length - 1, currentIndex()));
        if(count) count.textContent = (idx+1) + "/" + imgs.length;
        dots.forEach(function(d,i){ d.classList.toggle("is-active", i===idx); });
      }
      function goTo(idx){
        idx = Math.max(0, Math.min(imgs.length - 1, idx));
        track.scrollTo({ left: idx * track.clientWidth, behavior: "smooth" });
      }
      var scrollTimer = null;
      track.addEventListener("scroll", function(){
        if(scrollTimer) cancelAnimationFrame(scrollTimer);
        scrollTimer = requestAnimationFrame(update);
      });
      if(prev) prev.addEventListener("click", function(){ goTo(currentIndex() - 1); });
      if(next) next.addEventListener("click", function(){ goTo(currentIndex() + 1); });
      update();

      if(onTap){
        var tapX = 0, tapY = 0, tapMoved = false;
        gal.addEventListener("pointerdown", function(e){
          tapX = e.clientX; tapY = e.clientY; tapMoved = false;
        });
        gal.addEventListener("pointermove", function(e){
          if(Math.abs(e.clientX - tapX) > 8 || Math.abs(e.clientY - tapY) > 8) tapMoved = true;
        });
        gal.addEventListener("pointercancel", function(){ tapMoved = true; });
        gal.addEventListener("pointerup", function(e){
          if(e.pointerType === "mouse") return;
          if(tapMoved) return;
          if(e.target.closest && e.target.closest(".gal-nav")) return;
          onTap(gal);
        });
      }
    });
  }

  // Before/After slider: drag directly from wherever the finger touches the image,
  // rather than requiring a precise grab on the (invisible) native range handle.
  // A small direction-lock decides, on the first few pixels of movement, whether the
  // gesture is a horizontal drag (slider) or a vertical one (page scroll) so the two
  // never fight each other.
  function wireCompare(root, onTap){
    root.querySelectorAll(".compare[data-before]").forEach(function(el){
      if(el.dataset.wired) return;
      el.dataset.wired = "1";
      var range = el.querySelector(".cmp-range");
      var after = el.querySelector(".cmp-after");
      var handle = el.querySelector(".cmp-handle");

      function setPercent(pct){
        pct = Math.max(0, Math.min(100, pct));
        after.style.clipPath = "inset(0 "+(100-pct)+"% 0 0)";
        handle.style.left = pct+"%";
        if(range) range.value = pct;
      }
      function percentFromX(clientX){
        var rect = el.getBoundingClientRect();
        return (clientX - rect.left) / rect.width * 100;
      }

      if(range){
        range.addEventListener("input", function(){ setPercent(parseFloat(range.value)); });
      }

      var state = null; // null | "pending" | "drag"
      var startX = 0, startY = 0;

      el.addEventListener("pointerdown", function(e){
        if(e.pointerType === "mouse" && e.button !== 0) return;
        startX = e.clientX; startY = e.clientY;
        if(e.pointerType === "mouse"){
          state = "drag";
          el.setPointerCapture(e.pointerId);
          setPercent(percentFromX(e.clientX));
        }else{
          state = "pending";
        }
      });
      el.addEventListener("pointermove", function(e){
        if(!state) return;
        var dx = e.clientX - startX, dy = e.clientY - startY;
        if(state === "pending"){
          if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
          if(Math.abs(dx) > Math.abs(dy)){
            state = "drag";
            el.setPointerCapture(e.pointerId);
          }else{
            state = "scrolling";
            return;
          }
        }
        if(state === "drag"){
          e.preventDefault();
          setPercent(percentFromX(e.clientX));
        }
      }, { passive:false });
      function endDrag(e, isCancel){
        var wasTap = !isCancel && onTap && state === "pending" && e.pointerType !== "mouse";
        if(state === "drag"){
          try{ el.releasePointerCapture(e.pointerId); }catch(err){}
        }
        state = null;
        if(wasTap) onTap(el);
      }
      el.addEventListener("pointerup", function(e){ endDrag(e, false); });
      el.addEventListener("pointercancel", function(e){ endDrag(e, true); });
    });
  }

  function renderItems(){
    var list = itemsForStore(currentStore).filter(function(it){ return it.visit_date === currentDate; })
      .sort(function(a,b){ return (parseInt(a.no,10)||0) - (parseInt(b.no,10)||0); });
    itemListEl.__list = list;

    // group by item_type, in order of first appearance. Headers (and the tabs above)
    // only show when there's more than one group — otherwise it's just a flat list.
    var groupOrder = [];
    var groups = {};
    list.forEach(function(item, idx){
      var g = typeKey(item);
      if(!groups[g]){ groups[g] = []; groupOrder.push(g); }
      groups[g].push(idx);
    });
    var showHeaders = groupOrder.length > 1;

    itemListEl.innerHTML = groupOrder.map(function(g){
      var cardsHtml = groups[g].map(function(idx){
        var item = list[idx];
        var ck = catKey(item.category);
        return '<article class="item-card" data-cat="'+ck+'" data-idx="'+idx+'">'+
          '<div class="item-head">'+
            '<span class="item-no">No.'+esc(item.no||"-")+'</span>'+
            '<h3>'+esc(item.item_name)+'</h3>'+
            '<span class="cat-badge cat-'+ck+'">'+esc(item.category||"-")+'</span>'+
          '</div>'+
          mediaMarkup(item, "", "card")+
          '<div class="item-foot">'+
            '<button class="expand-btn" data-idx="'+idx+'">⤢ 拡大表示</button>'+
          '</div>'+
          '<p class="remark">'+esc(item.remark||"")+'</p>'+
        '</article>';
      }).join("");
      var titleHtml = showHeaders ? '<div class="item-section-title">'+esc(typeLabel(g))+'</div>' : "";
      return '<div class="item-section" data-type="'+esc(g)+'">'+titleHtml+cardsHtml+'</div>';
    }).join("");

    function openFromEl(el){
      var card = el.closest(".item-card");
      if(card) openLightbox(parseInt(card.getAttribute("data-idx"),10));
    }
    wireCompare(itemListEl, openFromEl);
    wireGallery(itemListEl, openFromEl);
    itemListEl.querySelectorAll(".expand-btn").forEach(function(btn){
      btn.addEventListener("click", function(){ openLightbox(parseInt(btn.getAttribute("data-idx"),10)); });
    });
    applyFilters();
  }

  function openLightbox(idx){
    var item = (itemListEl.__list||[])[idx];
    if(!item) return;
    var wrap = document.getElementById("lbCompare");
    wrap.innerHTML = mediaMarkup(item, "cmp-contain", "lightbox");
    wireCompare(wrap);
    wireGallery(wrap);
    document.getElementById("lbCat").textContent = item.category || "";
    document.getElementById("lbTitle").textContent = item.item_name || "";
    document.getElementById("lbRemark").textContent = item.remark || "";
    lightbox.hidden = false;
    document.body.style.overflow = "hidden";
  }

  function closeLightbox(){
    lightbox.hidden = true;
    document.body.style.overflow = "";
    var content = lightbox.querySelector(".lb-content");
    if(content){ content.style.transition = ""; content.style.transform = ""; content.style.opacity = ""; }
    lightbox.style.background = "";
  }

  document.getElementById("lbClose").addEventListener("click", closeLightbox);

  // Swipe down to close: only engages when the lightbox is already scrolled to the
  // top (so it never fights with scrolling down to read a long remark), and only
  // for a gesture that starts out mostly vertical/downward (so it doesn't fight
  // with the before/after drag or the multi-photo horizontal swipe).
  (function(){
    var drag = null; // null | {startX, startY, state}
    lightbox.addEventListener("pointerdown", function(e){
      if(lightbox.hidden || lightbox.scrollTop > 0){ drag = null; return; }
      drag = { startX: e.clientX, startY: e.clientY, state: "pending" };
    });
    lightbox.addEventListener("pointermove", function(e){
      if(!drag) return;
      var dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
      if(drag.state === "pending"){
        if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        drag.state = (dy > 0 && dy > Math.abs(dx)) ? "closing" : "ignore";
      }
      if(drag.state === "closing"){
        e.preventDefault();
        var content = lightbox.querySelector(".lb-content");
        var dist = Math.max(0, dy);
        if(content){
          content.style.transition = "none";
          content.style.transform = "translateY(" + dist + "px)";
          content.style.opacity = String(Math.max(0.35, 1 - dist / 400));
        }
      }
    }, { passive: false });
    function endLbDrag(e){
      if(!drag) return;
      if(drag.state === "closing"){
        var dy = e.clientY - drag.startY;
        var content = lightbox.querySelector(".lb-content");
        if(dy > 90){
          closeLightbox();
        }else if(content){
          content.style.transition = "transform .2s ease, opacity .2s ease";
          content.style.transform = "";
          content.style.opacity = "";
        }
      }
      drag = null;
    }
    lightbox.addEventListener("pointerup", endLbDrag);
    lightbox.addEventListener("pointercancel", endLbDrag);
  })();

  document.getElementById("backBtn").addEventListener("click", function(){
    viewStore.hidden = true;
    viewList.hidden = false;
    window.scrollTo(0,0);
  });

  loadData();
})();
</script>
</body>
