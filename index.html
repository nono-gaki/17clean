<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#e2e7ee; --line:#d7dee6;
  --ink:#16202c; --ink-dim:#5b6676; --accent:#1f3f66; --accent-ink:#ffffff;
  --good:#2f7a63; --warn:#b8742a; --radius:14px; --radius-lg:22px;
  --font-display:'Zen Kaku Gothic New',"Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:'Zen Kaku Gothic New',"Hiragino Sans","Noto Sans JP",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);}
body{color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3{font-family:var(--font-display);font-weight:900;letter-spacing:.01em;margin:0;}
p{margin:0;}
button{font-family:inherit;}
img{max-width:100%;}

#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;}

.topbar{padding-block:4px 18px;}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:600;}
.topbar h1{font-size:26px;margin-top:6px;color:var(--ink);}
.topbar .sub{color:var(--ink-dim);font-size:13.5px;margin-top:6px;}

.state-box{margin-top:24px;padding:20px;border:1px solid var(--line);border-radius:var(--radius-lg);
  background:var(--surface);color:var(--ink-dim);font-size:13px;line-height:1.7;}
.state-box.error{border-color:#c0523f;color:#c0523f;}

.store-list{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.store-card{text-align:left;display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px;cursor:pointer;width:100%;color:inherit;}
.store-card:active{transform:scale(.99);}
.store-card .store-mark{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:13px;flex:none;}
.store-card .store-info{flex:1;min-width:0;}
.store-card .store-info h3{font-size:16px;}
.store-card .store-info .addr{color:var(--ink-dim);font-size:12px;margin-top:3px;}
.store-card .store-info .meta-row{display:flex;gap:10px;margin-top:7px;font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);flex-wrap:wrap;}
.store-card .chev{color:var(--ink-dim);flex:none;font-size:18px;}
.store-card.empty .store-info .meta-row{color:var(--warn);}

.detail-header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-block:6px 10px;margin-bottom:4px;}
.back-btn{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;padding:4px 0 10px;cursor:pointer;}
.detail-header h1{font-size:21px;}
.meta{display:flex;flex-direction:column;gap:3px;margin-top:8px;font-size:12px;color:var(--ink-dim);}
.meta .row span.k{font-family:var(--font-mono);color:var(--ink-dim);margin-right:8px;}
.meta .row span.v{color:var(--ink);}

.store-title-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;}
.store-title-row h1{margin:0;}
.meeting-points-btn{flex:none;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:999px;
  border:1px solid #cfe0f3;background:#eaf1fb;color:var(--accent);cursor:pointer;font-family:inherit;}
.meeting-points-btn.is-open{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.meeting-points{background:#eaf1fb;border:1px solid #cfe0f3;border-radius:var(--radius);margin-top:10px;padding:10px 14px 12px;}
.meeting-points-title{font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.02em;margin:10px 0 5px;}
.meeting-points-title:first-child{margin-top:0;}
.meeting-points-list{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;}
.meeting-points-list li{font-size:13px;line-height:1.6;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.meeting-points-list .mp-name{flex:1;}
.meeting-points-list .mp-price{flex:none;font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap;}
.meeting-points-list .mp-price .mp-unit{font-weight:400;color:var(--muted,#8a8f98);margin-left:3px;}

.date-picker{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none;}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none;}
.chips::-webkit-scrollbar,.date-picker::-webkit-scrollbar{display:none;}
.chip{flex:none;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-dim);cursor:pointer;}
.chip.is-active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

.type-tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;margin-top:14px;}
.type-tabs[hidden]{display:none;}
.type-tab{flex:1;text-align:center;padding:9px 6px;border:none;background:transparent;border-radius:9px;
  font-size:12.5px;font-weight:700;color:var(--ink-dim);cursor:pointer;}
.type-tab.is-active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18);}

.item-list{display:flex;flex-direction:column;gap:24px;margin-top:6px;}
.item-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px;}
@media (hover:hover) and (pointer:fine){ .item-card{cursor:pointer;} }
.item-card[hidden]{display:none;}
.item-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.item-no{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);}
.item-head h3{font-size:16px;flex:1;min-width:0;}
.cat-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;flex:none;}
.cat-badge.cat-kitchen{background:#f3e3cf;color:#7a4a12;}
.cat-badge.cat-hvac{background:#dde8f3;color:#1f4d7a;}
.cat-badge.cat-shop{background:#e2ecdf;color:#355c2c;}
.cat-badge.cat-other{background:var(--surface-2);color:var(--ink-dim);}

.compare{position:relative;width:100%;height:210px;border-radius:12px;overflow:hidden;background:var(--surface-2);touch-action:pan-y;}
.compare[data-before]{cursor:ew-resize;}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none;}
.compare.cmp-contain img{object-fit:contain;}
.compare .cmp-after{clip-path:inset(0 50% 0 0);}
.compare .cmp-range{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none;
  -webkit-appearance:none;appearance:none;background:transparent;}
.compare .cmp-handle{position:absolute;top:0;bottom:0;left:50%;width:0;pointer-events:none;}
.compare .cmp-handle::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);}
.compare .cmp-handle::after{content:"⇔";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;
  background:#fff;color:#16202c;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.compare .cmp-tag{position:absolute;top:8px;padding:3px 8px;font:600 10.5px/1 var(--font-mono);letter-spacing:.04em;border-radius:999px;background:rgba(10,16,24,.62);color:#fff;}
.compare .cmp-tag--before{left:8px;}
.compare .cmp-tag--after{right:8px;}
.compare .cmp-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;
  color:var(--ink-dim);font-size:11.5px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface-2);}

.media-fallback{display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;
  background:var(--surface-2);color:var(--ink-dim);font-size:11.5px;line-height:1.6;}
.compare .media-fallback{position:absolute;inset:0;}
.gal-track .media-fallback{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;}

.gallery{position:relative;width:100%;height:210px;border-radius:12px;overflow:hidden;background:transparent;}
.gallery.gal-contain{height:min(58vh,520px);max-height:min(58vh,520px);background:transparent;}
/* Neighboring photos peek in at the edges, packed close with a small gap, so
   swiping feels continuous instead of a blank jump — the centered photo stays
   the clear main focus. This is the card-view look only. */
.gallery .gal-track{display:flex;height:100%;width:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x pan-y;gap:8px;padding-inline:clamp(14px,6%,48px);}
.gallery .gal-track::-webkit-scrollbar{display:none;}
.gallery .gal-track img{flex:0 0 88%;width:88%;height:100%;object-fit:cover;scroll-snap-align:center;scroll-snap-stop:always;display:block;border-radius:10px;}
/* Lightbox (enlarged) view: no peeking, no gap — each photo fills the frame
   edge to edge so swiping to the next one feels like a single continuous
   filmstrip with nothing visible in between. */
.gallery.gal-contain .gal-track{gap:0;padding-inline:0;}
.gallery.gal-contain .gal-track img{flex:0 0 100%;width:100%;object-fit:contain;border-radius:0;}
.gallery .gal-count{position:absolute;top:8px;right:8px;padding:3px 8px;font:600 10.5px/1 var(--font-mono);letter-spacing:.04em;
  border-radius:999px;background:rgba(10,16,24,.62);color:#fff;pointer-events:none;}
.gallery .gal-nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;
  background:rgba(10,16,24,.55);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;cursor:pointer;}
.gallery .gal-prev{left:8px;}
.gallery .gal-next{right:8px;}
.gallery .gal-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none;}
.gallery .gal-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);}
.gallery .gal-dots span.is-active{background:#fff;}

.item-section{display:flex;flex-direction:column;gap:16px;}
.item-section-title{font-size:13px;font-weight:700;color:var(--ink-dim);letter-spacing:.02em;margin:0;
  padding-bottom:6px;border-bottom:1px solid var(--line);}

.remark{margin-top:10px;font-size:12.5px;line-height:1.7;color:var(--ink-dim);padding-top:10px;border-top:1px solid var(--line);white-space:pre-line;}

.lightbox{position:fixed;inset:0;background:#3c3f44;z-index:50;display:flex;flex-direction:column;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);}
.lightbox[hidden]{display:none;}
.lightbox{touch-action:pan-y;}
.lb-top{display:flex;justify-content:flex-end;max-width:520px;width:100%;margin:0 auto;}
.lb-close{background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;}
.lb-content{max-width:520px;width:100%;margin:10px auto 0;color:#fff;}
.lb-content .compare{height:min(52vh,480px);max-height:min(52vh,480px);}
.lb-cat{display:inline-block;margin-top:14px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14);}
.lb-content h2{font-size:19px;margin-top:8px;color:#fff;}
.lb-content .remark{color:rgba(255,255,255,.72);border-top:1px solid rgba(255,255,255,.18);}

@media (max-width:360px){ .compare{height:180px;} }

.price-list-link{display:inline-block;margin-top:14px;font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:999px;
  border:1px solid #cfe0f3;background:#eaf1fb;color:var(--accent);cursor:pointer;font-family:inherit;}

.price-view-sub{color:var(--ink-dim);font-size:12.5px;line-height:1.6;margin-top:4px;}

.price-section{margin-top:18px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:16px;}
.price-section:first-of-type{margin-top:16px;}
.price-section-title{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;
  color:var(--ink);letter-spacing:.01em;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line);}
.price-section-title::before{content:"";flex:none;width:4px;height:14px;border-radius:2px;background:var(--accent);}

.price-store-group{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-top:10px;}
.price-store-group:first-child{margin-top:0;}
.price-store-title{font-size:13.5px;font-weight:700;color:var(--ink);margin:0 0 8px;}

.price-table{display:flex;flex-direction:column;}
.price-section>.price-table{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);}
.price-section>.price-table>.price-row{padding:10px 14px;}
.price-store-group .price-table .price-row{padding:9px 0;}
.price-row{border-bottom:1px solid var(--line);}
.price-store-group .price-row{border-bottom-color:var(--line);}
.price-row:last-child{border-bottom:none;}
.price-row-main{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.price-row-name{font-size:13.5px;color:var(--ink);flex:1;}
.price-row-amount{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap;flex:none;}
.price-row-amount .price-row-unit{font-family:var(--font-body);font-weight:400;color:var(--ink-dim);font-size:11.5px;margin-left:3px;}
.price-row-note{margin-top:4px;font-size:11.5px;color:var(--ink-dim);line-height:1.5;}
.price-footnote{margin-top:16px;font-size:11.5px;color:var(--ink-dim);line-height:1.8;}

/* ---- machine map (俯瞰図) ---- */
.map-floor-tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;
  margin-top:14px;overflow-x:auto;scrollbar-width:none;}
.map-floor-tabs[hidden]{display:none;}
.map-floor-tabs::-webkit-scrollbar{display:none;}
.map-floor-tab{flex:none;min-width:64px;text-align:center;padding:9px 14px;border:none;background:transparent;
  border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink-dim);cursor:pointer;font-family:inherit;}
.map-floor-tab.is-active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18);}

.map-canvas-wrap{margin-top:14px;overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--line);
  background:var(--surface);-webkit-overflow-scrolling:touch;display:flex;justify-content:center;align-items:center;}
.map-canvas{position:relative;width:100%;aspect-ratio:8/5;background-color:var(--surface);
  container-type:inline-size;}
.map-section{position:absolute;border:1px solid var(--line);border-radius:12px;pointer-events:none;}
.map-section-label{position:absolute;top:clamp(5px,1cqw,8px);left:clamp(5px,1cqw,8px);
  padding:2px clamp(5px,1.2cqw,10px);border-radius:999px;white-space:nowrap;
  background:var(--surface-2);color:var(--ink);font-weight:800;font-size:clamp(9px,1.9cqw,13px);
  letter-spacing:.02em;}
.map-zone{position:absolute;border:1.5px dashed #b9c6d6;border-radius:8px;}
.map-zone-label{position:absolute;top:clamp(4px,0.9375cqw,6px);left:clamp(6px,1.25cqw,8px);
  font-size:clamp(9.5px,1.71875cqw,11px);font-weight:700;color:var(--ink-dim);
  letter-spacing:.02em;pointer-events:none;}
.map-zone-label.is-right{left:auto;right:clamp(6px,1.25cqw,8px);}
.map-outline-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.map-outline-fill{fill:none;stroke:none;}
.map-outline-wall{fill:none;stroke:#3a4452;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
.map-entrance{position:absolute;pointer-events:none;z-index:1;}
.map-entrance svg{width:100%;height:100%;display:block;overflow:visible;}
.map-door-leaf{fill:none;stroke:#2b2f36;stroke-width:2;stroke-linecap:square;}
.map-door-arc{fill:none;stroke:#2b2f36;stroke-width:1.5;}
/* Equipment is a plain box carrying only a small number that matches its
   row in the equipment list — names live in the tap bubble, the list and
   the detail panel rather than on the drawing itself. */
/* Equipment boxes are filled light grey with no outline, like the
   reference floor plan; the thin white border just keeps a box that sits on
   top of another (卓上コンロ on 低温コールド) visibly separate from it. */
.map-equip{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:2;box-sizing:border-box;
  min-width:clamp(26px,5.3125cqw,34px);min-height:clamp(20px,4.0625cqw,26px);
  border-radius:clamp(2px,0.4cqw,3px);background:#c8d1d9;border:1.5px solid #fff;}
.map-equip:active{background:var(--accent);}
.map-equip.is-selected{background:var(--accent);}
.map-equip-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--ink-dim);pointer-events:none;}
.map-equip.is-selected .map-equip-badge{color:var(--accent-ink);}
.map-equip.is-nested{min-width:0;min-height:0;}
.map-equip.is-nested .map-equip-badge{font-size:clamp(9.5px,1.5cqw,11px);}
.map-hint{margin-top:10px;font-size:11.5px;color:var(--ink-dim);}

/* ---- machine map equipment list (both mobile & desktop) ---- */
.map-layout[hidden]{display:none;}
.map-side-title{margin-top:18px;font-size:12.5px;font-weight:700;color:var(--ink-dim);letter-spacing:.02em;}
.map-side-count{font-weight:400;margin-left:2px;}
.map-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
.map-list-group{margin:8px 2px 0;font-size:12px;font-weight:800;color:var(--ink);}
.map-list-group:first-child{margin-top:0;}
.map-list-empty{font-size:12.5px;color:var(--ink-dim);padding:10px 2px;}
.map-list-row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;
  border:1.5px solid var(--line);border-radius:10px;background:var(--surface);
  cursor:pointer;text-align:left;font-family:inherit;}
.map-list-row.is-active{border-color:var(--accent);}
.map-list-badge{flex:none;width:22px;height:22px;border-radius:50%;background:var(--surface-2);
  color:var(--ink-dim);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.map-list-row.is-active .map-list-badge{background:var(--accent);color:var(--accent-ink);}
.map-list-name{flex:1;font-size:13px;font-weight:600;color:var(--ink);}

/* Phone: the details slide up as a sheet over the lower part of the screen
   only — no dark overlay, and the map above stays live, so tapping another
   box just switches the sheet's contents and tapping an empty part of the
   map (or ×, or swiping the sheet down) closes it. */
.map-detail{position:fixed;left:0;right:0;bottom:0;z-index:60;pointer-events:none;}
.map-detail[hidden]{display:none;}
.map-detail-backdrop{display:none;}
.map-detail-sheet{position:relative;pointer-events:auto;background:var(--surface);
  border-radius:20px 20px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));
  max-width:560px;margin:0 auto;max-height:60vh;overflow-y:auto;overscroll-behavior:contain;
  box-shadow:0 -2px 18px rgba(0,0,0,.13);animation:mapSheetUp .24s cubic-bezier(.22,.8,.24,1);
  transition:transform .18s ease-out;will-change:transform;}
.map-detail.is-closing .map-detail-sheet{animation:mapSheetDown .18s ease-in forwards;}
.map-detail-sheet.is-dragging{transition:none;}
.map-detail-handle{position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;
  border-radius:2px;background:var(--line);}
@keyframes mapSheetUp{from{transform:translateY(100%);}to{transform:none;}}
@keyframes mapSheetDown{to{transform:translateY(100%);}}
.map-detail-close{position:absolute;top:12px;right:14px;background:var(--surface-2);border:none;
  color:var(--ink-dim);width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer;}
.map-detail-name{font-family:var(--font-display);font-weight:900;font-size:17px;margin-right:30px;}
.map-detail-rows{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.map-detail-rows .row{display:flex;gap:10px;font-size:13px;}
.map-detail-rows .row .k{flex:none;width:86px;color:var(--ink-dim);font-family:var(--font-mono);
  font-size:11.5px;padding-top:1px;}
.map-detail-rows .row .v{flex:1;color:var(--ink);line-height:1.5;}
@keyframes mapPanelIn{from{transform:translateX(-100%);}to{transform:none;}}
@keyframes mapPanelOut{to{transform:translateX(-100%);}}

/* Speech-bubble callout over a box: shown only for the equipment that's
   been tapped/clicked (not on mouse-over) — like a shopping-mall floor guide. Kept inside the map's own width, with the
   little pointer still aimed at the box when it has to shift sideways. */
.map-canvas-wrap{position:relative;isolation:isolate;}  /* keeps the bubble under the sticky page header when scrolled */
.map-bubble{position:absolute;z-index:5;display:none;pointer-events:none;white-space:nowrap;text-align:center;
  transform:translateY(calc(-100% - 10px));background:var(--surface);border-radius:10px;
  padding:7px 12px;box-shadow:0 3px 14px rgba(0,0,0,.2);}
.map-bubble.is-shown{display:block;}
.map-bubble.is-below{transform:translateY(10px);}
.map-bubble::after{content:"";position:absolute;left:var(--ax,50%);bottom:-5px;width:10px;height:10px;
  background:var(--surface);transform:translateX(-50%) rotate(45deg);}
.map-bubble.is-below::after{bottom:auto;top:-5px;}
.map-bubble-name{font-size:13px;font-weight:700;color:var(--ink);}
.map-bubble-sub{font-size:10.5px;color:var(--ink-dim);margin-top:1px;}
.map-bubble-sub:empty{display:none;}
.map-list-row:hover{border-color:#b9c6d6;}
.map-list-row.is-active:hover{border-color:var(--accent);}
.map-hint-open{display:none;}
.map-canvas{transform-origin:0 0;}
.map-canvas.is-gliding{transition:transform .25s ease;}

/* On a phone the diagram goes edge-to-edge for a bigger, easier target to
   tap, and the how-to hint under it is left out. */
@media (max-width:719.98px){
  .map-canvas-wrap{margin-inline:-16px;border-radius:0;border-left:none;border-right:none;}
  .map-canvas-wrap{overflow:hidden;}
  .map-hint{display:none;}
  /* the sticky page header spans the full width too, so the edge-to-edge
     map never shows past its sides while scrolling underneath it */
  #view-map .detail-header{margin-inline:-16px;padding-inline:16px;}
  .map-canvas-wrap.is-zoomed{box-shadow:inset 0 0 0 2px rgba(31,63,102,.12);}
  /* just enough room below the list for the sheet's own height, so the
     end of the list can still be scrolled clear of it (no big empty gap;
     the page already has 48px of bottom padding of its own) */
  body.map-detail-open #view-map{padding-bottom:max(0px, calc(var(--map-sheet-h, 0px) - 36px));}
}

@media (min-width:720px){
  #app{max-width:1040px;}
  .store-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
  .item-section{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;align-items:start;}
  .item-section-title{grid-column:1/-1;}
  .lb-top, .lb-content{max-width:1100px;}
  .lb-content .compare{height:min(78vh,860px);max-height:min(78vh,860px);}
  .gallery.gal-contain{height:min(78vh,860px);max-height:min(78vh,860px);}
  .map-canvas{max-width:860px;}
  /* PC: diagram on the left (stays in view while the list scrolls), the
     plain name list on the right, numbered to match the boxes. */
  .map-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;column-gap:20px;align-items:start;
    transition:grid-template-columns .4s cubic-bezier(.3,.7,.2,1), column-gap .4s cubic-bezier(.3,.7,.2,1);}
  .map-side{min-width:0;overflow:hidden;transition:opacity .3s ease, visibility .3s;}
  .map-list-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .map-main{position:sticky;top:12px;}
  .map-side-title{margin-top:14px;}
  .map-list-row{padding:8px 12px;}
  .map-list-name{font-size:12.5px;}

  /* PC, modelled on a mall floor guide: the map page gets the full width,
     and an equipment's details open as a panel down the left edge instead
     of a modal sheet, so the map stays visible and clickable — click
     another box to switch, or an empty part of the map to close it. */
  #app:has(#view-map:not([hidden])){max-width:1440px;}
  .map-detail{inset:0 auto 0 0;width:300px;}
  .map-detail-backdrop{display:none;}
  .map-detail{right:auto;}
  .map-detail-sheet{position:absolute;inset:0;max-width:none;max-height:none;margin:0;border-radius:0;
    padding:60px 24px 28px;box-shadow:4px 0 24px rgba(0,0,0,.14);animation:mapPanelIn .4s cubic-bezier(.3,.7,.2,1);}
  .map-detail.is-closing .map-detail-sheet{animation:mapPanelOut .32s cubic-bezier(.5,0,.75,.4) forwards;}
  .map-detail-handle{display:none;}
  .map-detail-close{top:16px;right:16px;width:34px;height:34px;}
  .map-detail-name{font-size:21px;margin-right:0;}
  .map-detail-rows{margin-top:18px;gap:0;border-top:1px solid var(--line);}
  .map-detail-rows .row{padding:11px 2px;border-bottom:1px solid var(--line);}
  body.map-detail-open .map-hint-default{display:none;}
  body.map-detail-open .map-hint-open{display:inline;}
}
/* From 1200px wide the page makes room by easing its left padding in step
   with the panel's slide, keeping the equipment list in view (the map keeps
   its card height; at ~1470px and up the drawing itself doesn't shrink).
   Narrower than that the panel sits over the left of the map instead, so
   the map isn't squeezed small. */
@media (min-width:1200px){
  body{transition:padding-left .4s cubic-bezier(.3,.7,.2,1);}
  body.map-detail-open{padding-left:var(--map-shift, 300px);}
}
[hidden]{display:none!important;}
</style>
</head>
<body>
<div id="app">

  <div id="view-list" class="view">
    <header class="topbar">
      <div class="eyebrow">LIFE MARK&apos;S</div>
      <h1>整備・清掃レポート</h1>
      <p class="sub">店舗を選択してください</p>
      <button type="button" class="price-list-link" id="priceListBtn">料金表を見る</button>
    </header>
    <div id="listState"></div>
    <div class="store-list" id="storeList"></div>
  </div>

  <div id="view-store" class="view" hidden>
    <header class="detail-header">
      <button class="back-btn" id="backBtn">← 店舗一覧に戻る</button>
      <div class="store-title-row">
        <h1 id="storeName"></h1>
        <button type="button" class="meeting-points-btn" id="meetingPointsBtn" hidden>整備箇所</button>
        <button type="button" class="meeting-points-btn" id="machineMapBtn" hidden>機器マップ</button>
      </div>
      <div class="meta" id="storeMeta"></div>
    </header>
    <div class="meeting-points" id="meetingPoints" hidden></div>
    <div class="date-picker" id="datePicker" hidden></div>
    <div class="type-tabs" id="typeTabs" hidden></div>
    <div class="chips" id="filterChips"></div>
    <div id="storeState"></div>
    <div class="item-list" id="itemList"></div>
    <div class="state-box" id="itemEmptyMsg" hidden></div>
  </div>

  <div id="view-price" class="view" hidden>
    <header class="detail-header">
      <button class="back-btn" id="priceBackBtn">← 店舗一覧に戻る</button>
      <h1>価格表</h1>
    </header>
    <p class="price-view-sub">整備・清掃の基本料金と項目別の価格一覧です。店舗ごとの項目は打ち合わせ内容に基づきます。</p>
    <div id="priceContent"></div>
  </div>

  <div id="view-map" class="view" hidden>
    <header class="detail-header">
      <button class="back-btn" id="mapBackBtn">← 店舗に戻る</button>
      <h1 id="mapStoreName"></h1>
    </header>
    <div class="map-floor-tabs" id="mapFloorTabs" hidden></div>
    <div class="map-layout" id="mapLayout">
      <div class="map-main">
        <div class="map-canvas-wrap" id="mapCanvasWrap"><div class="map-canvas" id="mapCanvas"></div>
          <div class="map-bubble" id="mapBubble"><div class="map-bubble-name"></div><div class="map-bubble-sub"></div></div>
        </div>
        <p class="map-hint"><span class="map-hint-default">機器をタップするとメーカー・型式・年式・シリアルNo.が表示されます。一覧からも選べます。</span><span class="map-hint-open">ヒント：図面の空いている所をクリックすると詳細を閉じます。</span></p>
      </div>
      <aside class="map-side">
        <div class="map-side-title">機器一覧<span class="map-side-count" id="mapListCount"></span></div>
        <div class="map-list" id="mapList"></div>
      </aside>
    </div>
    <div class="state-box" id="mapEmptyMsg" hidden>この店舗の機器マップはまだ登録されていません。</div>
  </div>

  <div id="mapDetail" class="map-detail" hidden>
    <div class="map-detail-backdrop" id="mapDetailBackdrop"></div>
    <div class="map-detail-sheet" id="mapDetailSheet">
      <div class="map-detail-handle"></div>
      <button class="map-detail-close" id="mapDetailClose" aria-label="閉じる">×</button>
      <div class="map-detail-name" id="mapDetailName"></div>
      <div class="map-detail-rows" id="mapDetailRows"></div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <div class="lb-top"><button class="lb-close" id="lbClose" aria-label="閉じる">×</button></div>
    <div class="lb-content">
      <div id="lbCompare"></div>
      <span class="lb-cat" id="lbCat"></span>
      <h2 id="lbTitle"></h2>
      <p class="remark" id="lbRemark"></p>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---- configuration ----

  function driveImg(url){
    if(!url) return null;
    url = String(url).trim();
    if(!url || url.indexOf("PASTE_") === 0) return null;
    var m = url.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
    if(m) return "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1000";
    if(/^https?:\/\//.test(url)) return url;
    return null;
  }

  async function loadData(){

    var OLD_SHEET_TABS = ["stores","items","meeting_points","prices","equipment_map"];
    var sheetsUrl = function(tabs){
      return "https://sheets.googleapis.com/v4/spreadsheets/" + SHEET_ID + "/values:batchGet?" +
        tabs.map(function(t){ return "ranges=" + encodeURIComponent("'" + t + "'!A1:Z2000"); }).join("&") +
        "&key=" + API_KEY;
    };
    try{
      var res = await fetch(sheetsUrl(SHEET_TABS));
      if(res.status === 400) res = await fetch(sheetsUrl(OLD_SHEET_TABS));
      if(!res.ok) throw new Error("HTTP " + res.status);
      var json = await res.json();
      var vr = json.valueRanges || [];
      STORES = rowsToObjects((vr[0]||{}).values);
      ITEMS = rowsToObjects((vr[1]||{}).values);
      // 店舗別打ち合わせ箇所, 価格表 and 機器マップ are optional — older
      // spreadsheets without those tabs just come back with an empty/missing
      // range, which is fine (no points / no prices / no map shown, nothing
      // breaks).
      MEETINGS = rowsToObjects((vr[2]||{}).values);
      PRICES = rowsToObjects((vr[3]||{}).values);
      EQUIPMENT_MAP = rowsToObjects((vr[4]||{}).values);
      buildPriceMaps();
      listStateEl.innerHTML = "";

      dataReady = true;
