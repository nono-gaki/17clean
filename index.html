  // Clamped 0–100 percentage read from a sheet cell, with a fallback for
  // blank/invalid values so one bad row never breaks the whole map.
  function mapPct(v, fallback){
    var n = parseFloat(v);
    return isNaN(n) ? fallback : Math.max(0, Math.min(100, n));
  }

  // Simple architectural door-swing symbol (leaf + wall opening + swing arc)
  // used for kind="entrance" rows, so 入口 reads as an entrance at a glance
  // instead of just another labeled box.
  var DOOR_SVG = '<svg viewBox="0 0 40 40" preserveAspectRatio="xMinYMin meet">' +
    '<path d="M6 4 L6 34" stroke="#5b6676" stroke-width="2.5" fill="none" stroke-linecap="round"/>' +
    '<path d="M6 34 L34 34" stroke="#5b6676" stroke-width="2.5" fill="none" stroke-linecap="round"/>' +
    '<path d="M6 4 A30 30 0 0 1 34 34" stroke="#5b6676" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>' +
    '</svg>';

  // Door symbol from the entrance row's door / swing / hinge columns:
  //   door  — 両開き (two leaves) or 片開き (one leaf, the default)
  //   swing — which way it opens: 上 / 下 / 左 / 右 (the wall opening is on
  //           the opposite side of the box)
  //   hinge — for 片開き, which end the leaf hangs from: 左 / 右 for a door
  //           opening up/down, 上 / 下 for one opening left/right
  // Drawn as the open leaf/leaves plus the swing arc, kept in true
  // proportion inside the row's box and pinned to the opening side. Rows
  // without a swing keep the old generic icon.
  function doorSvg(e){
    var swing = String(e.swing || "").trim();
    if (!/^[上下左右]$/.test(swing)) return DOOR_SVG;
    var dbl = /両/.test(String(e.door || ""));
    var hinge = String(e.hinge || "").trim();
    var L = dbl ? 20 : 40;                 // leaf length; the opening is 40 long
    var vertical = swing === "左" || swing === "右";
    // (u along the opening 0..40, v out from it 0..L) -> SVG x,y
    var map = function(u, v){
      if (swing === "上") return [u, L - v];
      if (swing === "下") return [u, v];
      if (swing === "左") return [L - v, u];
      return [v, u];
    };
    var leaves = dbl ? [[0, 1], [40, -1]]
      : [(hinge === "右" || hinge === "下") ? [40, -1] : [0, 1]];
    var parts = leaves.map(function(lf){
      var uh = lf[0], dir = lf[1];
      var a = map(uh, 0), b = map(uh, L);
      var pts = [];
      for (var i = 0; i <= 16; i++) {
        var t = (Math.PI / 2) * i / 16;
        var q = map(uh + dir * L * Math.sin(t), L * Math.cos(t));
        pts.push(q[0].toFixed(2) + "," + q[1].toFixed(2));
      }
      return '<line class="map-door-leaf" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" vector-effect="non-scaling-stroke"/>' +
        '<polyline class="map-door-arc" points="'+pts.join(" ")+'" vector-effect="non-scaling-stroke"/>';
    });
    var vb = vertical ? "0 0 " + L + " 40" : "0 0 40 " + L;
    var par = {"上": "xMidYMax", "下": "xMidYMin", "左": "xMaxYMid", "右": "xMinYMid"}[swing] + " meet";
    return '<svg viewBox="'+vb+'" preserveAspectRatio="'+par+'">' + parts.join("") + '</svg>';
  }

  function renderMapCanvas(storeId, floor, keepSelection){
    var canvas = document.getElementById("mapCanvas");
    var rows = equipmentMapForStore(storeId).filter(function(r){ return (r.floor || "").trim() === floor; });
    var kindOf = function(r){ return (r.kind || "").trim(); };
    var zones = rows.filter(function(r){ return kindOf(r) === "zone"; });
    var outlines = rows.filter(function(r){ return kindOf(r) === "outline"; });
    var entrances = rows.filter(function(r){ return kindOf(r) === "entrance"; });
    var sections = rows.filter(function(r){ return kindOf(r) === "section"; });
    // anything that isn't a zone/outline/entrance/section row is a piece of equipment
    var NON_EQUIP_KINDS = {"zone":1, "outline":1, "entrance":1, "section":1};
    var items = rows.filter(function(r){ return !NON_EQUIP_KINDS[kindOf(r)]; });

    // kind="section": splits one tab's map into labelled parts (e.g. a tab
    // "2F・3F" showing both floors side by side) — a light frame with a
    // heading tag in its top-left corner. x/y/w/h as for a zone.
    var html = sections.map(function(sc){
      var x = mapPct(sc.x,0), y = mapPct(sc.y,0), w = mapPct(sc.w,50), h = mapPct(sc.h,100);
      return '<div class="map-section" style="left:'+x+'%;top:'+y+'%;width:'+w+'%;height:'+h+'%;">'+
        '<div class="map-section-label">'+esc(sc.label||"")+'</div></div>';
    }).join("");

    // The zone's name (客席 …) normally sits in its top-left corner; if a
    // piece of equipment covers that corner it moves to the top-right
    // instead, so the name is never hidden under a box.
    var equipRects = items.map(function(it){
      var ex = mapPct(it.x,50), ey = mapPct(it.y,50);
      var ew = String(it.w||"").trim() !== "" ? mapPct(it.w,10) : 4, eh = String(it.h||"").trim() !== "" ? mapPct(it.h,9) : 4;
      return {l: ex - ew/2, r: ex + ew/2, t: ey - eh/2, b: ey + eh/2};
    });
    var covered = function(l, r, t, b){
      return equipRects.some(function(e){ return e.l < r && e.r > l && e.t < b && e.b > t; });
    };
    html += zones.map(function(z){
      var x = mapPct(z.x,0), y = mapPct(z.y,0), w = mapPct(z.w,20), h = mapPct(z.h,20);
      var lw = 2 + String(z.label||"").length * 1.8, lh = 6;   // rough label size, in % of the map
      var right = covered(x, x + lw, y, y + lh) && !covered(x + w - lw, x + w, y, y + lh);
      return '<div class="map-zone" style="left:'+x+'%;top:'+y+'%;width:'+w+'%;height:'+h+'%;">'+
        '<div class="map-zone-label'+(right ? ' is-right' : '')+'">'+esc(z.label||"")+'</div></div>';
    }).join("");

    // A "wall" shape too irregular for a simple rectangle (an L-shape, a
    // notch cut out of a corner, …) — one continuous outline traced as a
    // single SVG polygon, so there's no double border/"seam" where separate
    // rectangle zones would otherwise touch. `points` is "x:y,x:y,…" in %
    // and is used for the filled tint (so a notch is correctly excluded).
    // `walls` (optional) is the set of edges actually drawn as a solid wall
    // line: one or more "x:y,x:y,…" chains separated by "|" — any edge of
    // the shape that isn't part of a chain (e.g. the inner edges of a notch
    // that's simply open, not a walled-off nook) is left undrawn. Omit it
    // to just stroke the whole `points` polygon as before.
    var outlinePtsToSvg = function(str){
      return String(str||"").trim().split(",").map(function(p){
        var xy = p.split(":");
        return mapPct(xy[0],0) + "," + mapPct(xy[1],0);
      }).join(" ");
    };
    html += outlines.map(function(o){
      var pts = outlinePtsToSvg(o.points);
      var labelHtml = o.label ? '<div class="map-zone-label" style="left:'+mapPct(o.x,0)+'%;top:'+mapPct(o.y,0)+'%;">'+esc(o.label)+'</div>' : "";
      var wallsRaw = String(o.walls||"").trim();
      var wallEl;
      if(wallsRaw){
        var d = wallsRaw.split("|").map(function(seg){
          return "M " + outlinePtsToSvg(seg).split(" ").join(" L ");
        }).join(" ");
        wallEl = '<path class="map-outline-wall" d="'+d+'" vector-effect="non-scaling-stroke"/>';
      } else {
        wallEl = '<polygon class="map-outline-wall" points="'+pts+'" vector-effect="non-scaling-stroke"/>';
      }
      return '<svg class="map-outline-svg" viewBox="0 0 100 100" preserveAspectRatio="none">'+
        '<polygon class="map-outline-fill" points="'+pts+'"/>' + wallEl +
        '</svg>' + labelHtml;
    }).join("");

    // Icon only — no text label, so it reads as a plain architectural
    // entrance mark rather than another named box.
    html += entrances.map(function(e){
      var x = mapPct(e.x,0), y = mapPct(e.y,0), w = mapPct(e.w,8), h = mapPct(e.h,14);
      return '<div class="map-entrance" style="left:'+x+'%;top:'+y+'%;width:'+w+'%;height:'+h+'%;">'+
        doorSvg(e) + '</div>';
    }).join("");

    // Equipment is drawn as a plain rectangle (positioned by its center
    // point via x/y — w/h are optional and size it precisely like a real
    // counter slot; left blank, it falls back to a small generic box) with
    // just a small number inside matching its row in the list. Names aren't
    // written on the diagram: they appear in a speech bubble when tapped,
    // in the list, and in the detail panel, which keeps the drawing clean.
    // A box that sits entirely on top of another one (e.g. 卓上コンロ on the
    // 低温コールド) is drawn at its true size — never blown up to the minimum
    // tap size, which on a phone would make it stick out past the box it sits
    // on — and the box underneath moves its own number into the part that
    // isn't covered, so both numbers stay readable.
    var rectOf = function(it){
      if (String(it.w||"").trim() === "" || String(it.h||"").trim() === "") return null;
      var x = mapPct(it.x,50), y = mapPct(it.y,50), w = mapPct(it.w,10), h = mapPct(it.h,9);
      return {l: x - w/2, r: x + w/2, t: y - h/2, b: y + h/2, w: w, h: h};
    };
    var rects = items.map(rectOf);
    var parentOf = rects.map(function(rc, i){
      if (!rc) return -1;
      for (var j = 0; j < rects.length; j++) {
        var p = rects[j];
        if (j === i || !p || p.w * p.h <= rc.w * rc.h) continue;
        if (rc.l >= p.l - 0.01 && rc.r <= p.r + 0.01 && rc.t >= p.t - 0.01 && rc.b <= p.b + 0.01) return j;
      }
      return -1;
    });
    // …but a nested box is also made a comfortable size to see and tap: at
    // least 80% of the width of the box it sits on and a little taller,
    // staying put near where it was and always kept inside that box.
    rects = rects.map(function(rc, i){
      var j = parentOf[i];
      if (j < 0) return rc;
      var p = rects[j];
      var w = Math.max(rc.w, p.w * 0.8), h = Math.max(rc.h, Math.min(10, p.h * 0.5));
      var m = Math.min(0.8, (p.w - w) / 2);
      var cx = Math.max(p.l + m + w / 2, Math.min(p.r - m - w / 2, (rc.l + rc.r) / 2));
      var t = Math.max(p.t + 0.8, Math.min(rc.t, p.b - 0.8 - h));
      return {l: cx - w / 2, r: cx + w / 2, t: t, b: t + h, w: w, h: h};
    });
    var boxesHtml = items.map(function(it, idx){
      var x = mapPct(it.x,50), y = mapPct(it.y,50);
      var sizeStyle = "";
      if(String(it.w||"").trim() !== "") sizeStyle += "width:" + mapPct(it.w,10) + "%;";
      if(String(it.h||"").trim() !== "") sizeStyle += "height:" + mapPct(it.h,9) + "%;";
      if (parentOf[idx] >= 0) {
        var nr = rects[idx];
        x = +((nr.l + nr.r) / 2).toFixed(2); y = +((nr.t + nr.b) / 2).toFixed(2);
        sizeStyle = "width:" + nr.w.toFixed(2) + "%;height:" + nr.h.toFixed(2) + "%;";
      }
      var cls = "map-equip" + (parentOf[idx] >= 0 ? " is-nested" : "");
      // this box's own children: put its number in the uncovered part
      var badgeStyle = "";
      var kids = rects.filter(function(_, k){ return parentOf[k] === idx; });
      if (kids.length && rects[idx]) {
        var p = rects[idx], mid = (p.t + p.b) / 2;
        var above = kids.every(function(k){ return (k.t + k.b) / 2 <= mid; });
        var below = kids.every(function(k){ return (k.t + k.b) / 2 > mid; });
        if (above) {
          var kb = Math.max.apply(null, kids.map(function(k){ return k.b; }));
          badgeStyle = ' style="top:' + ((kb - p.t) / p.h * 100).toFixed(1) + '%;"';
        } else if (below) {
          var kt = Math.min.apply(null, kids.map(function(k){ return k.t; }));
          badgeStyle = ' style="bottom:' + ((p.b - kt) / p.h * 100).toFixed(1) + '%;"';
        }
      }
      return '<div class="'+cls+'" data-idx="'+idx+'" aria-label="'+esc(it.label||"")+'" style="left:'+x+'%;top:'+y+'%;'+sizeStyle+'">'+
        '<span class="map-equip-badge"'+badgeStyle+'>'+(idx+1)+'</span></div>';
    });

    html += boxesHtml.join("");

    // A re-render just for a size change (window resize, the detail panel
    // opening and shifting the page) keeps whatever was selected.
    var keep = keepSelection ? currentMapSelected : -1;
    canvas.innerHTML = html;
    currentMapItems = items;
    currentMapSelected = -1;
    showMapBubble(-1);
    // New floor/store: back to the whole-map view; a size-only re-render
    // keeps the zoom, just re-clamped to the new size.
    if (keepSelection) clampMapZoom(); else resetMapZoom();

    canvas.querySelectorAll(".map-equip").forEach(function(el){
      var idx = parseInt(el.getAttribute("data-idx"), 10);
      el.addEventListener("click", function(){ selectMapEquip(idx, "map"); });
    });

    renderMapList(items, sections);

    if (keep >= 0 && keep < items.length) applyMapSelection(keep, false);
  }

  // The equipment list under the map: same items as the boxes on the
  // canvas, numbered to match the on-canvas badges, so either side can be
  // used to find a piece of equipment on mobile and desktop alike.
  function renderMapList(items, sections){
    var el = document.getElementById("mapList");
    document.getElementById("mapListCount").textContent = items.length ? "（" + items.length + "台）" : "";
    if (!items.length) { el.innerHTML = '<div class="map-list-empty">このフロアには機器が登録されていません。</div>'; return; }
    // When the map is split into sections (2F / 3F …), the list gets a small
    // heading wherever the section changes, going by which section each
    // box sits in.
    var sectionOf = function(it){
      var x = mapPct(it.x,50), y = mapPct(it.y,50);
      for (var i = 0; i < (sections || []).length; i++) {
        var sc = sections[i];
        var sx = mapPct(sc.x,0), sy = mapPct(sc.y,0), sw = mapPct(sc.w,50), sh = mapPct(sc.h,100);
        if (x >= sx && x <= sx + sw && y >= sy && y <= sy + sh) return sc.label || "";
      }
      return null;
    };
    var lastSection;
    el.innerHTML = items.map(function(it, idx){
      var head = "";
      if (sections && sections.length) {
        var sec = sectionOf(it);
        if (sec !== lastSection && sec) head = '<div class="map-list-group">'+esc(sec)+'</div>';
        lastSection = sec;
      }
      return head + '<button type="button" class="map-list-row" data-idx="'+idx+'">'+
        '<span class="map-list-badge">'+(idx+1)+'</span>'+
        '<span class="map-list-name">'+esc(it.label||"-")+'</span></button>';
    }).join("");
    el.querySelectorAll(".map-list-row").forEach(function(row){
      var idx = parseInt(row.getAttribute("data-idx"), 10);
      row.addEventListener("click", function(){ selectMapEquip(idx, "list"); });
    });
  }

  // Speech-bubble callout above a box: product name, plus maker/model
  // underneath when known. Flips below the box when there isn't room above
  // it inside the map card. idx -1 hides it.
  // It lives in the map card itself rather than in the (zoomable) drawing,
  // so it stays the same size at any zoom and is re-placed after each
  // pan/zoom.
  var mapBubbleIdx = -1;
  function showMapBubble(idx){
    var canvas = document.getElementById("mapCanvas");
    var wrap = document.getElementById("mapCanvasWrap");
    var bubble = document.getElementById("mapBubble");
    mapBubbleIdx = idx;
    var item = currentMapItems[idx];
    var box = item ? canvas.querySelector('.map-equip[data-idx="'+idx+'"]') : null;
    var w = wrap.getBoundingClientRect(), r = box ? box.getBoundingClientRect() : null;
    var ox = w.left + wrap.clientLeft, oy = w.top + wrap.clientTop;
    var cw = wrap.clientWidth, ch = wrap.clientHeight;
    var cx = r ? r.left - ox + r.width / 2 : 0, top = r ? r.top - oy : 0, bottom = r ? r.bottom - oy : 0;
    // hidden when nothing's chosen, or when the box is panned out of view
    if (!box || cx < 0 || cx > cw || bottom < 0 || top > ch) { bubble.classList.remove("is-shown"); return; }
    bubble.querySelector(".map-bubble-name").textContent = item.label || "-";
    bubble.querySelector(".map-bubble-sub").textContent =
      [item.maker, item.model].filter(function(v){ return v; }).join(" ・ ");
    bubble.classList.add("is-shown");
    var below = top < bubble.offsetHeight + 16;
    bubble.classList.toggle("is-below", below);
    // Centre it on the box, but keep it inside the map's own width (a box
    // near the edge would otherwise push it off-screen on a phone) and aim
    // the little pointer back at the box.
    var bw = bubble.offsetWidth;
    var left = Math.max(6, Math.min(cw - bw - 6, cx - bw / 2));
    bubble.style.left = left + "px";
    bubble.style.setProperty("--ax", Math.max(12, Math.min(bw - 12, cx - left)) + "px");
    bubble.style.top = (below ? bottom : top) + "px";
  }

  // ---- phone: pinch-zoom / drag the map itself (not the whole page) ----
  // The drawing is scaled/moved with a CSS transform inside its card, which
  // clips it. At normal size a one-finger swipe still scrolls the page as
  // usual; two fingers zoom; once zoomed in, one finger drags the map.
  var mapZoom = {s: 1, tx: 0, ty: 0};
  var MAP_ZOOM_MAX = 4;
  function isPhoneMap(){ return !window.matchMedia("(min-width:720px)").matches; }
  function applyMapZoom(){
    var canvas = document.getElementById("mapCanvas");
    var wrap = document.getElementById("mapCanvasWrap");
    canvas.style.transform = mapZoom.s === 1 ? "" :
      "translate(" + mapZoom.tx + "px," + mapZoom.ty + "px) scale(" + mapZoom.s + ")";
    wrap.style.touchAction = mapZoom.s > 1 ? "none" : "";
    wrap.classList.toggle("is-zoomed", mapZoom.s > 1);
    showMapBubble(mapBubbleIdx);
  }
  function clampMapZoom(){
    var canvas = document.getElementById("mapCanvas");
    if (!isPhoneMap()) { mapZoom = {s: 1, tx: 0, ty: 0}; applyMapZoom(); return; }
    var W = canvas.offsetWidth, H = canvas.offsetHeight;
    mapZoom.s = Math.max(1, Math.min(MAP_ZOOM_MAX, mapZoom.s));
    mapZoom.tx = Math.min(0, Math.max(W - W * mapZoom.s, mapZoom.tx));
    mapZoom.ty = Math.min(0, Math.max(H - H * mapZoom.s, mapZoom.ty));
    applyMapZoom();
  }
  function resetMapZoom(){ mapZoom = {s: 1, tx: 0, ty: 0}; applyMapZoom(); }
  // Zoom to scale s keeping the point (px, py) — relative to the map card —
  // fixed on screen.
  function zoomMapAt(s, px, py){
    var k = s / mapZoom.s;
    mapZoom.tx = px - (px - mapZoom.tx) * k;
    mapZoom.ty = py - (py - mapZoom.ty) * k;
    mapZoom.s = s;
    clampMapZoom();
  }
  // "Move to this box" glides rather than jumps; finger gestures stay
  // instant. The bubble is re-placed once the glide ends.
  var mapAnimTimer = null;
  function glideMap(){
    var canvas = document.getElementById("mapCanvas");
    canvas.classList.add("is-gliding");
    clearTimeout(mapAnimTimer);
    mapAnimTimer = setTimeout(function(){
      canvas.classList.remove("is-gliding");
      showMapBubble(mapBubbleIdx);
    }, 260);
  }
  // When zoomed in, slide the map so the given box is in the middle.
  function panMapToEquip(idx){
    if (mapZoom.s <= 1) return;
    var canvas = document.getElementById("mapCanvas");
    var box = canvas.querySelector('.map-equip[data-idx="'+idx+'"]');
    if (!box) return;
    var c = canvas.getBoundingClientRect(), r = box.getBoundingClientRect();
    var lx = (r.left + r.width / 2 - c.left) / mapZoom.s, ly = (r.top + r.height / 2 - c.top) / mapZoom.s;
    mapZoom.tx = canvas.offsetWidth / 2 - lx * mapZoom.s;
    mapZoom.ty = canvas.offsetHeight / 2 - ly * mapZoom.s;
    glideMap();
    clampMapZoom();
  }

  // Highlights the box, its name label (when shown), its list row and its
  // bubble together. Shared by clicks on either side and by re-renders.
  function applyMapSelection(idx, scrollList){
    currentMapSelected = idx;
    var canvas = document.getElementById("mapCanvas");
    canvas.querySelectorAll(".is-selected").forEach(function(el){ el.classList.remove("is-selected"); });
    canvas.querySelectorAll('[data-idx="'+idx+'"]').forEach(function(el){ el.classList.add("is-selected"); });
    var listEl = document.getElementById("mapList");
    listEl.querySelectorAll(".is-active").forEach(function(el){ el.classList.remove("is-active"); });
    var row = listEl.querySelector('.map-list-row[data-idx="'+idx+'"]');
    if (row) {
      row.classList.add("is-active");
      if (scrollList) row.scrollIntoView({block:"nearest", behavior:"smooth"});
    }
    showMapBubble(idx);
  }

  // A tap on the map ("map") or on the list ("list"): select it and open
  // its details. On PC a click on the map brings its row into view in the
  // list alongside; on a phone the page never jumps down to the list —
  // instead it only scrolls if needed so the chosen box sits in view above
  // the sheet (which matters when it was picked from the list below).
  function selectMapEquip(idx, from){
    var item = currentMapItems[idx];
    if (!item) return;
    var isPc = window.matchMedia("(min-width:720px)").matches;
    applyMapSelection(idx, isPc && from === "map");
    openMapDetail(item);
    if (!isPc) {
      panMapToEquip(idx);   // when zoomed in, bring the chosen box to the middle
      keepMapEquipInView(idx);
    }
  }

  function keepMapEquipInView(idx){
    var box = document.querySelector('#mapCanvas .map-equip[data-idx="'+idx+'"]');
    var sheet = document.getElementById("mapDetailSheet");
    if (!box || !sheet) return;
    requestAnimationFrame(function(){
      // Visible strip: below the sticky page header, above the sheet.
      var header = document.querySelector("#view-map .detail-header");
      var top = (header ? header.getBoundingClientRect().bottom : 0) + 8;
      var bottom = window.innerHeight - sheet.offsetHeight - 12;
      // Where the box sits on screen — when zoomed in it's being glided to
      // the middle of the map, so use that spot rather than where it is
      // mid-glide; otherwise only the part showing inside the map counts.
      var b = box.getBoundingClientRect(), w = document.getElementById("mapCanvasWrap").getBoundingClientRect();
      var r;
      if (mapZoom.s > 1) {
        var mid = w.top + w.height / 2, half = Math.min(b.height, w.height) / 2;
        r = {top: mid - half, bottom: mid + half};
      } else {
        r = {top: Math.max(b.top, w.top), bottom: Math.min(b.bottom, w.bottom)};
      }
      r.height = Math.max(0, r.bottom - r.top);
      var bubbleRoom = 60;  // the bubble sits above the box
      if (r.top - bubbleRoom >= top && r.bottom <= bottom) return;
      // Prefer bringing the whole map into that strip; if it's taller than
      // the strip, centre the box in it instead.
      var wrap = document.getElementById("mapCanvasWrap").getBoundingClientRect();
      var dy = (wrap.height <= bottom - top)
        ? wrap.top - top
        : (r.top + r.height / 2) - (top + bottom) / 2;
      window.scrollBy({top: dy, behavior: "smooth"});
    });
  }

  // The drawing itself is all in % and resizes on its own; only the
  // pixel-placed bits (the bubble, a phone zoom's pan limits) need nudging
  // when the map's width changes — once per frame, so they keep up smoothly
  // while the detail panel slides the page over.
  if (window.ResizeObserver) {
    // (a ResizeObserver callback runs after layout but before paint, so the
    // bubble moves in the very same frame as the map — no lag)
    var mapRO = new ResizeObserver(function(){
      if (viewMap.hidden) return;
      applyMapHeightLock();
      clampMapZoom();
    });
    mapRO.observe(document.getElementById("mapCanvas"));
    mapRO.observe(document.getElementById("mapCanvasWrap"));
  }

  function openMapDetail(item){
    if(!item) return;
    document.getElementById("mapDetailName").textContent = item.label || "-";
    var rows = [];
    if(item.maker) rows.push(["メーカー", item.maker]);
    if(item.model) rows.push(["型式", item.model]);
    if(item.year) rows.push(["年式", item.year]);
    if(item.serial) rows.push(["シリアルNo.", item.serial]);
    if(item.note) rows.push(["備考", item.note]);
    document.getElementById("mapDetailRows").innerHTML = rows.length
      ? rows.map(function(r){ return '<div class="row"><span class="k">'+esc(r[0])+'</span><span class="v">'+esc(r[1])+'</span></div>'; }).join("")
      : '<div class="row"><span class="v">詳細情報はありません。</span></div>';
    var panel = document.getElementById("mapDetail");
    clearTimeout(mapDetailCloseTimer);
    panel.classList.remove("is-closing");
    document.getElementById("mapDetailSheet").style.transform = "";
    panel.hidden = false;
    if (!document.body.classList.contains("map-detail-open")) setMapShift();
    lockMapHeight();
    document.body.classList.add("map-detail-open");
    // phone: the page gets bottom room matching the sheet's actual height
    document.documentElement.style.setProperty("--map-sheet-h",
      document.getElementById("mapDetailSheet").offsetHeight + "px");
  }

  // PC: while the detail panel is open (and while it slides in/out) the page
  // narrows, which would make the 8:5 map — and everything below it — shrink
  // and grow in height. Instead the map card keeps the height it had with the
  // panel closed, and the drawing just scales down inside it (centred), so
  // nothing moves up or down when opening/closing.
  var mapLock = null, mapUnlockTimer = null;
  // How far the page slides over for the panel: as far as it can (up to the
  // panel's 300px) *without* the map getting any narrower — i.e. the spare
  // room around the drawing in its card, plus any margin outside the page's
  // 1440px max width. Whatever's left over, the panel simply overlaps, so
  // the drawing itself never shrinks.
  function setMapShift(){
    var wrap = document.getElementById("mapCanvasWrap"), canvas = document.getElementById("mapCanvas");
    var slack = Math.max(0, wrap.clientWidth - canvas.offsetWidth);
    var outside = Math.max(0, document.documentElement.clientWidth - 1440);
    var shift = Math.max(0, Math.min(300, Math.floor(slack + outside)));
    document.documentElement.style.setProperty("--map-shift", shift + "px");
  }
  function lockMapHeight(){
    clearTimeout(mapUnlockTimer);
    if (mapLock || !window.matchMedia("(min-width:1200px)").matches) return;
    var wrap = document.getElementById("mapCanvasWrap"), canvas = document.getElementById("mapCanvas");
    mapLock = {wrapH: wrap.offsetHeight, canvasH: canvas.offsetHeight};
    applyMapHeightLock();
  }
  function applyMapHeightLock(){
    if (!mapLock) return;
    var wrap = document.getElementById("mapCanvasWrap"), canvas = document.getElementById("mapCanvas");
    wrap.style.height = mapLock.wrapH + "px";
    canvas.style.width = Math.min(wrap.clientWidth, mapLock.canvasH * 8 / 5) + "px";
  }
  function unlockMapHeight(){
    mapLock = null;
    document.getElementById("mapCanvasWrap").style.height = "";
    document.getElementById("mapCanvas").style.width = "";
  }

  // Closing plays the slide-out first (the page eases back at the same
  // time), then actually hides the panel.
  var mapDetailCloseTimer = null;
  function closeMapDetail(){
    var panel = document.getElementById("mapDetail");
    if (!panel.hidden && !panel.classList.contains("is-closing")) {
      panel.classList.add("is-closing");
      clearTimeout(mapDetailCloseTimer);
      mapDetailCloseTimer = setTimeout(function(){
        panel.hidden = true;
        panel.classList.remove("is-closing");
        document.getElementById("mapDetailSheet").style.transform = "";
      }, 330);
    }
    document.body.classList.remove("map-detail-open");
    // release the height lock only once the page has finished easing back
    // to full width (its transition is .4s), when the map's natural height
    // is the same again
    clearTimeout(mapUnlockTimer);
    if (mapLock) mapUnlockTimer = setTimeout(unlockMapHeight, 450);
    currentMapSelected = -1;
    document.querySelectorAll("#mapCanvas .is-selected, #mapList .is-active").forEach(function(el){
      el.classList.remove("is-selected", "is-active");
    });
    showMapBubble(-1);
  }

  // ---- store list ----
  function renderStores(){
    var activeStores = STORES.filter(function(s){ return String(s.active).toUpperCase() !== "FALSE"; });
    if(!activeStores.length){
      listStateEl.innerHTML = '<div class="state-box">店舗がまだ登録されていません。スプレッドシートの「店舗」シートに行を追加してください。</div>';
      storeListEl.innerHTML = "";
      return;
    }
    storeListEl.innerHTML = activeStores.map(function(s, idx){
      var dates = visitDatesForStore(s.store_id);
      var count = itemsForStore(s.store_id).length;
      var mark = esc((s.store_name||s.store_id||"?").slice(0,2));
      if(!dates.length){
        return '<button class="store-card empty" data-store="'+esc(s.store_id)+'">'+
          '<div class="store-mark">'+mark+'</div>'+
          '<div class="store-info">'+
            '<h3>'+esc(s.store_name)+'</h3>'+
            '<div class="addr">'+esc(s.address||"")+'</div>'+
            '<div class="meta-row"><span>実績はまだありません</span></div>'+
          '</div>'+
          '<div class="chev">›</div>'+
        '</button>';
      }
      return '<button class="store-card" data-store="'+esc(s.store_id)+'">'+
        '<div class="store-mark">'+mark+'</div>'+
        '<div class="store-info">'+
          '<h3>'+esc(s.store_name)+'</h3>'+
          '<div class="addr">'+esc(s.address||"")+'</div>'+
          '<div class="meta-row"><span>担当: '+esc(s.staff||"-")+'</span><span>最終実施: '+esc(dates[0])+'</span><span>'+itemsForStore(s.store_id).filter(function(it){return it.visit_date===dates[0];}).length+'項目</span></div>'+
        '</div>'+
        '<div class="chev">›</div>'+
      '</button>';
    }).join("");

    storeListEl.querySelectorAll(".store-card").forEach(function(btn){
      btn.addEventListener("click", function(){ openStore(btn.getAttribute("data-store")); });
    });
  }

  // ---- store detail ----
  // Pushes a history entry so the browser's own back gesture — the trackpad's
  // two-finger swipe on desktop, the edge-swipe on iOS Safari, the Android back
  // button, or the actual back button — all land back on the store list
  // through the popstate handler below, instead of just leaving the site.
  function openStore(storeId){
    saveViewState();
    history.pushState({view:"store", storeId:storeId}, "", "#store=" + encodeURIComponent(storeId));
    showStoreView(storeId);
  }

  // opts (optional, when coming back to a page after a reload or via the
  // back button): {date, type, cat} — the visit date and filters to reopen on.
  function showStoreView(storeId, opts){
    opts = opts || {};
    var store = STORES.filter(function(s){ return s.store_id === storeId; })[0];
    if(!store) return;
    currentStore = storeId;

    document.getElementById("storeName").textContent = store.store_name || storeId;
    document.getElementById("storeMeta").innerHTML =
      '<div class="row"><span class="k">住所</span><span class="v">'+esc(store.address||"-")+'</span></div>'+
      '<div class="row"><span class="k">担当者</span><span class="v">'+esc(store.staff||"-")+'</span></div>';
    renderMeetingPoints(storeId);
    renderMachineMapButton(storeId);

    var dates = visitDatesForStore(storeId);
    if(!dates.length){
      storeStateEl.innerHTML = '<div class="state-box" style="margin-top:14px;">この店舗の実施実績はまだ登録されていません。「報告」シートに行を追加すると、ここに表示されます。</div>';
      itemListEl.innerHTML = "";
      chipsEl.innerHTML = "";
      datePickerEl.hidden = true;
      datePickerEl.innerHTML = "";
      typeTabsEl.hidden = true;
      typeTabsEl.innerHTML = "";
      itemEmptyMsgEl.hidden = true;
    }else{
      storeStateEl.innerHTML = "";
      currentDate = (opts.date && dates.indexOf(opts.date) !== -1) ? opts.date : dates[0];
      if(dates.length > 1){
        datePickerEl.hidden = false;
        datePickerEl.innerHTML = dates.map(function(d,i){
          return '<button class="chip'+(d===currentDate?" is-active":"")+'" data-date="'+esc(d)+'">'+esc(d)+'</button>';
        }).join("");
        datePickerEl.querySelectorAll(".chip").forEach(function(chip){
          chip.addEventListener("click", function(){
            datePickerEl.querySelectorAll(".chip").forEach(function(c){c.classList.remove("is-active");});
            chip.classList.add("is-active");
            currentDate = chip.getAttribute("data-date");
            currentCatFilter = "all";
            currentTypeFilter = "すべて";
            renderTypeTabs();
            renderChips();
            renderItems();
          });
        });
      }else{
        datePickerEl.hidden = true;
        datePickerEl.innerHTML = "";
      }
      currentCatFilter = opts.cat || "all";
      currentTypeFilter = opts.type || "すべて";
      renderTypeTabs();
      renderChips();
      renderItems();
    }

    viewList.hidden = true;
    viewPrice.hidden = true;
    viewMap.hidden = true;
    viewStore.hidden = false;
    window.scrollTo(0,0);
  }

  function renderChips(){
    var cats = ["all","kitchen","hvac","shop","other"];
    var labels = {all:"すべて",kitchen:"厨房",hvac:"空調",shop:"店舗",other:"その他"};
    var present = {};
    itemsForStore(currentStore).forEach(function(it){ present[catKey(it.category)] = true; });
    var list = cats.filter(function(c){ return c==="all" || present[c]; });
    chipsEl.innerHTML = list.map(function(c){
      return '<button class="chip'+(c===currentCatFilter?" is-active":"")+'" data-cat="'+c+'">'+labels[c]+'</button>';
    }).join("");
    chipsEl.querySelectorAll(".chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        chipsEl.querySelectorAll(".chip").forEach(function(c){c.classList.remove("is-active");});
        chip.classList.add("is-active");
        currentCatFilter = chip.getAttribute("data-cat");
        applyFilters();
      });
    });
  }

  // "共通"/"個別" (or whatever labels are used in the sheet) as a tab row, so the
  // distinction is a clear top-level switch rather than just a section heading.
  // Based on every type the store has EVER used (not just the currently selected
  // date), so the tabs stay put when switching dates — a date with only one type
  // recorded just shows an empty state on the other tab instead of hiding it.
  function renderTypeTabs(){
    var order = []; var seen = {};
    itemsForStore(currentStore).forEach(function(it){
      var k = typeKey(it);
      if(!seen[k]){ seen[k] = true; order.push(k); }
    });
    if(order.length <= 1){
      typeTabsEl.hidden = true;
      typeTabsEl.innerHTML = "";
      return;
    }
    typeTabsEl.hidden = false;
    var tabs = ["すべて"].concat(order);
    typeTabsEl.innerHTML = tabs.map(function(t){
      var label = t === "すべて" ? t : typeLabel(t);
      return '<button class="type-tab'+(t===currentTypeFilter?" is-active":"")+'" data-type="'+esc(t)+'">'+esc(label)+'</button>';
    }).join("");
    typeTabsEl.querySelectorAll(".type-tab").forEach(function(btn){
      btn.addEventListener("click", function(){
        typeTabsEl.querySelectorAll(".type-tab").forEach(function(c){ c.classList.remove("is-active"); });
        btn.classList.add("is-active");
        currentTypeFilter = btn.getAttribute("data-type");
        applyFilters();
      });
    });
  }

  function applyFilters(){
    var anyVisibleAtAll = false;
    itemListEl.querySelectorAll(".item-section").forEach(function(section){
      var typeOk = currentTypeFilter === "すべて" || section.getAttribute("data-type") === currentTypeFilter;
      if(!typeOk){ section.hidden = true; return; }
      var anyVisible = false;
      section.querySelectorAll(".item-card").forEach(function(card){
        var show = (currentCatFilter==="all" || card.getAttribute("data-cat")===currentCatFilter);
        card.hidden = !show;
        if(show) anyVisible = true;
      });
      section.hidden = !anyVisible;
      if(anyVisible) anyVisibleAtAll = true;
    });
    if(itemEmptyMsgEl){
      var hasAnySection = itemListEl.querySelectorAll(".item-section").length > 0;
      itemEmptyMsgEl.hidden = !hasAnySection || anyVisibleAtAll;
      if(!itemEmptyMsgEl.hidden){
        var label = currentTypeFilter === "すべて" ? "" : typeLabel(currentTypeFilter) + "の";
        itemEmptyMsgEl.textContent = "この日付には" + label + "項目がありません。";
      }
    }
  }

  // photos.length === 2 → Before/After compare slider (the common case).
  // photos.length === 0 → placeholder. Anything else → swipeable gallery.
  function mediaMarkup(item, extraClass, mode){
    var photos = parsePhotos(item);
    var name = esc(item.item_name);

    if(photos.length === 0){
      return '<div class="compare '+(extraClass||'')+'"><div class="cmp-placeholder">写真未登録</div></div>';
    }

    if(photos.length === 2){
      return '<div class="compare '+(extraClass||'')+'" data-before="1">'+
        '<img class="cmp-before" src="'+esc(photos[0])+'" alt="'+name+' Before" loading="lazy" onerror="handleImgError(this)">'+
        '<img class="cmp-after" src="'+esc(photos[1])+'" alt="'+name+' After" loading="lazy" onerror="handleImgError(this)">'+
        '<input class="cmp-range" type="range" min="0" max="100" value="50" aria-label="Before After 比較">'+
        '<div class="cmp-handle"></div>'+
        '<span class="cmp-tag cmp-tag--before">BEFORE</span>'+
        '<span class="cmp-tag cmp-tag--after">AFTER</span>'+
      '</div>';
    }

    var contain = mode === "lightbox";

    if(photos.length === 1){
      return '<div class="compare '+(contain?'cmp-contain':'cmp-tappable')+'">'+
        '<img src="'+esc(photos[0])+'" alt="'+name+'" loading="lazy" onerror="handleImgError(this)"></div>';
    }

    // 3+: swipeable gallery with nav arrows + dots (scroll-snap also makes it touch-swipeable)
    var imgs = photos.map(function(p){
      return '<img src="'+esc(p)+'" alt="'+name+'" loading="lazy" onerror="handleImgError(this)">';
    }).join("");
    var dots = photos.map(function(_, i){
      return '<span class="'+(i===0?"is-active":"")+'"></span>';
    }).join("");
    return '<div class="gallery'+(contain?' gal-contain':'')+'">'+
      '<div class="gal-track">'+imgs+'</div>'+
      '<button type="button" class="gal-nav gal-prev" aria-label="前の写真">‹</button>'+
      '<button type="button" class="gal-nav gal-next" aria-label="次の写真">›</button>'+
      '<span class="gal-count">1/'+photos.length+'</span>'+
      '<div class="gal-dots">'+dots+'</div>'+
    '</div>';
  }

  // onTap (optional) fires for a plain touch tap on the image area — i.e. the
  // pointer didn't move enough to count as a swipe and didn't land on the nav
  // buttons — so the main item list can open the lightbox on mobile without a
  // separate "拡大表示" button to tap.
  // Which photo a gallery is currently centered on — shared by wireGallery's
  // own tap handler and the desktop whole-card click handler, so opening the
  // lightbox can land on the same photo that was already showing.
  function galleryActiveIndex(gal){
    var track = gal.querySelector(".gal-track");
    if(!track) return 0;
    var imgs = track.querySelectorAll("img");
    var target = track.scrollLeft + track.clientWidth / 2;
    var best = 0, bestDist = Infinity;
    imgs.forEach(function(img, i){
      var center = img.offsetLeft + img.offsetWidth / 2;
      var d = Math.abs(center - target);
      if(d < bestDist){ bestDist = d; best = i; }
    });
    return best;
  }

  // Lightbox-only: shrinks/grows the media box to exactly match a photo's own
  // aspect ratio, so a portrait photo fills the full width with no left/right
  // letterbox bars left over from object-fit:contain. The CSS max-height set
  // on .gal-contain / .lb-content .compare still caps it for very tall shots.
  function fitContainHeight(box, img){
    if(!box || !img) return;
    var w = img.naturalWidth, h = img.naturalHeight;
    if(!w || !h) return;
    var width = box.clientWidth;
    if(!width) return;
    box.style.height = (width * h / w) + "px";
  }

  function wireGallery(root, onTap){
    root.querySelectorAll(".gallery").forEach(function(gal){
      if(gal.dataset.wired) return;
      gal.dataset.wired = "1";
      var track = gal.querySelector(".gal-track");
      var imgs = track.querySelectorAll("img");
      var count = gal.querySelector(".gal-count");
      var dots = gal.querySelectorAll(".gal-dots span");
      var prev = gal.querySelector(".gal-prev");
      var next = gal.querySelector(".gal-next");
      var isContain = gal.classList.contains("gal-contain"); // lightbox only

      // Measures actual slide positions rather than assuming slide width === track
      // width, so this works whether slides are full-width (lightbox) or peek a bit
      // of their neighbors at the edges (compact card view).
      function currentIndex(){
        var target = track.scrollLeft + track.clientWidth / 2;
        var best = 0, bestDist = Infinity;
        imgs.forEach(function(img, i){
          var center = img.offsetLeft + img.offsetWidth / 2;
          var d = Math.abs(center - target);
          if(d < bestDist){ bestDist = d; best = i; }
        });
        return best;
      }
      function fitActive(idx){
        if(!isContain) return;
        var img = imgs[idx];
        if(!img) return;
        if(img.complete && img.naturalWidth){
          fitContainHeight(gal, img);
        }else{
          img.addEventListener("load", function(){ fitContainHeight(gal, img); }, { once:true });
        }
      }
      function update(){
        var idx = Math.max(0, Math.min(imgs.length - 1, currentIndex()));
        if(count) count.textContent = (idx+1) + "/" + imgs.length;
        dots.forEach(function(d,i){ d.classList.toggle("is-active", i===idx); });
        fitActive(idx);
      }
      function goTo(idx){
        idx = Math.max(0, Math.min(imgs.length - 1, idx));
        var img = imgs[idx];
        if(!img) return;
        var target = img.offsetLeft + img.offsetWidth / 2 - track.clientWidth / 2;
        track.scrollTo({ left: target, behavior: "smooth" });
      }
      var scrollTimer = null;
      track.addEventListener("scroll", function(){
        if(scrollTimer) cancelAnimationFrame(scrollTimer);
        scrollTimer = requestAnimationFrame(update);
      });
      if(prev) prev.addEventListener("click", function(){ goTo(currentIndex() - 1); });
      if(next) next.addEventListener("click", function(){ goTo(currentIndex() + 1); });
      update();

      if(onTap){
        var tapX = 0, tapY = 0, tapMoved = false;
        gal.addEventListener("pointerdown", function(e){
          if(zoomActive()) return;
          tapX = e.clientX; tapY = e.clientY; tapMoved = false;
        });
        gal.addEventListener("pointermove", function(e){
          if(Math.abs(e.clientX - tapX) > 8 || Math.abs(e.clientY - tapY) > 8) tapMoved = true;
        });
        gal.addEventListener("pointercancel", function(){ tapMoved = true; });
        gal.addEventListener("pointerup", function(e){
          if(e.pointerType === "mouse") return; // desktop: whole card handles clicks (wireCardOpen)
          if(zoomActive()) return;
          if(tapMoved) return;
          if(e.target.closest && e.target.closest(".gal-nav")) return;
          onTap(gal, currentIndex());
        });
      }
    });
  }

  // Before/After slider: drag directly from wherever the finger touches the image,
  // rather than requiring a precise grab on the (invisible) native range handle.
  // A small direction-lock decides, on the first few pixels of movement, whether the
  // gesture is a horizontal drag (slider) or a vertical one (page scroll) so the two
  // never fight each other.
  function wireCompare(root, onTap){
    root.querySelectorAll(".compare[data-before]").forEach(function(el){
      if(el.dataset.wired) return;
      el.dataset.wired = "1";
      var range = el.querySelector(".cmp-range");
      var after = el.querySelector(".cmp-after");
      var handle = el.querySelector(".cmp-handle");

      function setPercent(pct){
        pct = Math.max(0, Math.min(100, pct));
        after.style.clipPath = "inset(0 "+(100-pct)+"% 0 0)";
        handle.style.left = pct+"%";
        if(range) range.value = pct;
      }
      function percentFromX(clientX){
        var rect = el.getBoundingClientRect();
        return (clientX - rect.left) / rect.width * 100;
      }
      // On desktop, when this card also opens a lightbox on click (onTap set),
      // only a grab near the dividing line should move it — clicking anywhere
      // else is a click-to-expand instead. In the lightbox itself (no onTap)
      // the whole image still drags the divider, same as before.
      function nearHandle(clientX){
        var rect = handle.getBoundingClientRect();
        return Math.abs(clientX - rect.left) <= 24;
      }

      if(range){
        range.addEventListener("input", function(){ setPercent(parseFloat(range.value)); });
      }

      var state = null; // null | "pending" | "drag"
      var startX = 0, startY = 0;

      el.addEventListener("pointerdown", function(e){
        if(e.pointerType === "mouse" && e.button !== 0) return;
        if(zoomActive()) return;
        startX = e.clientX; startY = e.clientY;
        if(e.pointerType === "mouse"){
          if(onTap && !nearHandle(e.clientX)){
            // Not grabbing the line — let the click bubble up to the
            // card-level open handler (wireCardOpen) instead of dragging.
            state = null;
          }else{
            state = "drag";
            el.setPointerCapture(e.pointerId);
            setPercent(percentFromX(e.clientX));
          }
        }else{
          state = "pending";
        }
      });
      el.addEventListener("pointermove", function(e){
        if(!state) return;
        if(zoomActive()){ state = null; return; }
        var dx = e.clientX - startX, dy = e.clientY - startY;
        if(state === "pending"){
          if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
          if(Math.abs(dx) > Math.abs(dy)){
            state = "drag";
            el.setPointerCapture(e.pointerId);
          }else{
            state = "scrolling";
            return;
          }
        }
        if(state === "drag"){
          e.preventDefault();
          setPercent(percentFromX(e.clientX));
        }
      }, { passive:false });
      function endDrag(e, isCancel){
        var wasTouchTap = !isCancel && onTap && state === "pending" && e.pointerType !== "mouse";
        if(state === "drag"){
          try{ el.releasePointerCapture(e.pointerId); }catch(err){}
        }
        state = null;
        if(wasTouchTap) onTap(el);
      }
      el.addEventListener("pointerup", function(e){ endDrag(e, false); });
      el.addEventListener("pointercancel", function(e){ endDrag(e, true); });
    });
  }

  // Plain single-photo cards have no before/after drag at all, so the whole
  // card is just a tap/click target to open the lightbox.
  function wireSingleTap(root, onTap){
    root.querySelectorAll(".compare.cmp-tappable").forEach(function(el){
      if(el.dataset.wired) return;
      el.dataset.wired = "1";
      var startX = 0, startY = 0, moved = false;
      el.addEventListener("pointerdown", function(e){
        if(zoomActive()) return;
        startX = e.clientX; startY = e.clientY; moved = false;
      });
      el.addEventListener("pointermove", function(e){
        if(Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) moved = true;
      });
      el.addEventListener("pointercancel", function(){ moved = true; });
      el.addEventListener("pointerup", function(e){
        if(e.pointerType === "mouse") return; // desktop: whole card handles clicks (wireCardOpen)
        if(zoomActive()) return;
        if(moved) return;
        if(onTap) onTap(el);
      });
    });
  }

  // Desktop only: clicking anywhere inside a card's white frame opens the
  // lightbox — title, badge, remark text, the photo itself — except for an
  // actual drag on the before/after divider or a tap on the gallery's
  // prev/next arrows, which are handled by their own wiring above.
  function wireCardOpen(root, onOpen){
    if(root.dataset.cardOpenWired) return; // root (itemListEl) persists across re-renders
    root.dataset.cardOpenWired = "1";
    root.addEventListener("pointerdown", function(e){
      if(e.pointerType !== "mouse") return;
      var card = e.target.closest(".item-card");
      if(!card) return;
      var cmp = e.target.closest(".compare[data-before]");
      var skip = false;
      if(cmp){
        var handle = cmp.querySelector(".cmp-handle");
        if(handle){
          var rect = handle.getBoundingClientRect();
          skip = Math.abs(e.clientX - rect.left) <= 24;
        }
      }
      card.__cardOpenSkip = skip;
      card.__cardOpenX = e.clientX;
      card.__cardOpenY = e.clientY;
    });
    root.addEventListener("pointerup", function(e){
      if(e.pointerType !== "mouse") return;
      var card = e.target.closest(".item-card");
      if(!card) return;
      if(card.__cardOpenSkip) return;
      if(e.target.closest && e.target.closest(".gal-nav")) return;
      if(zoomActive()) return;
      var dx = Math.abs(e.clientX - (card.__cardOpenX || 0));
      var dy = Math.abs(e.clientY - (card.__cardOpenY || 0));
      if(dx > 6 || dy > 6) return;
      var gal = card.querySelector(".gallery");
      onOpen(card, gal ? galleryActiveIndex(gal) : 0);
    });
  }

  function renderItems(){
    var list = itemsForStore(currentStore).filter(function(it){ return it.visit_date === currentDate; })
      .sort(function(a,b){ return (parseInt(a.no,10)||0) - (parseInt(b.no,10)||0); });
    itemListEl.__list = list;

    // group by item_type, in order of first appearance. Headers (and the tabs above)
    // only show when there's more than one group — otherwise it's just a flat list.
    var groupOrder = [];
    var groups = {};
    list.forEach(function(item, idx){
      var g = typeKey(item);
      if(!groups[g]){ groups[g] = []; groupOrder.push(g); }
      groups[g].push(idx);
    });
    var showHeaders = groupOrder.length > 1;

    itemListEl.innerHTML = groupOrder.map(function(g){
      var cardsHtml = groups[g].map(function(idx){
        var item = list[idx];
        var ck = catKey(item.category);
        return '<article class="item-card" data-cat="'+ck+'" data-idx="'+idx+'">'+
          '<div class="item-head">'+
            '<span class="item-no">No.'+esc(item.no||"-")+'</span>'+
            '<h3>'+esc(item.item_name)+'</h3>'+
            '<span class="cat-badge cat-'+ck+'">'+esc(item.category||"-")+'</span>'+
          '</div>'+
          mediaMarkup(item, "", "card")+
          '<p class="remark">'+esc(item.remark||"")+'</p>'+
        '</article>';
      }).join("");
      var titleHtml = showHeaders ? '<div class="item-section-title">'+esc(typeLabel(g))+'</div>' : "";
      return '<div class="item-section" data-type="'+esc(g)+'">'+titleHtml+cardsHtml+'</div>';
    }).join("");

    function openFromEl(el, photoIdx){
      var card = el.closest(".item-card");
      if(card) openLightbox(parseInt(card.getAttribute("data-idx"),10), photoIdx||0);
    }
    wireCompare(itemListEl, openFromEl);
    wireGallery(itemListEl, openFromEl);
    wireSingleTap(itemListEl, openFromEl);
    wireCardOpen(itemListEl, function(card, photoIdx){
      openLightbox(parseInt(card.getAttribute("data-idx"),10), photoIdx||0);
    });
    applyFilters();
  }

  // Pinch-to-zoom + pan for the lightbox (enlarged) view, plus double-tap as a
  // one-finger shortcut for the same thing. Only wired on the lightbox's own copy
  // of the media (openLightbox below) — the small cards in the list already have
  // their hands full with the before/after drag and gallery swipe.
  function wireZoom(root){
    var media = root.querySelector(".compare, .gallery");
    if(!media || media.dataset.zoomWired) return;
    media.dataset.zoomWired = "1";
    var isGallery = media.classList.contains("gallery");
    var track = isGallery ? media.querySelector(".gal-track") : null;

    var scale = 1, panX = 0, panY = 0;
    var pointers = {};
    var pinchStart = null;
    var panStart = null;
    var lastTapTime = 0, lastTapX = 0, lastTapY = 0;

    // The active image's own box (not the track's — the track is wider than one
    // photo now that neighbors peek in at the edges). offsetLeft/offsetWidth are
    // used instead of getBoundingClientRect() because they stay stable (unaffected
    // by the zoom transform itself) throughout a pinch/pan gesture.
    function activeImg(){
      if(!isGallery) return null;
      var imgs = track.querySelectorAll("img");
      if(!imgs.length) return null;
      var target = track.scrollLeft + track.clientWidth / 2;
      var best = imgs[0], bestDist = Infinity;
      imgs.forEach(function(img){
        var center = img.offsetLeft + img.offsetWidth / 2;
        var d = Math.abs(center - target);
        if(d < bestDist){ bestDist = d; best = img; }
      });
      return best;
    }
    function currentTargets(){
      if(isGallery){
        var img = activeImg();
        return img ? [img] : [];
      }
      return Array.prototype.slice.call(media.children).filter(function(c){ return c.tagName === "IMG"; });
    }
    function boxSize(){
      if(isGallery){
        var img = activeImg();
        return img ? { w: img.offsetWidth, h: img.offsetHeight } : { w: 0, h: 0 };
      }
      return { w: media.clientWidth, h: media.clientHeight };
    }
    function localPoint(clientX, clientY){
      if(isGallery){
        var img = activeImg();
        if(!img) return { x: 0, y: 0 };
        var trackRect = track.getBoundingClientRect();
        var imgLeft = trackRect.left + (img.offsetLeft - track.scrollLeft);
        var imgTop = trackRect.top + (img.offsetTop - track.scrollTop);
        return { x: clientX - imgLeft, y: clientY - imgTop };
      }
      var rect = media.getBoundingClientRect();
      return { x: clientX - rect.left, y: clientY - rect.top };
    }
    function clamp(){
      var size = boxSize();
      var minX = Math.min(0, size.w - size.w * scale);
      var minY = Math.min(0, size.h - size.h * scale);
      panX = Math.max(minX, Math.min(0, panX));
      panY = Math.max(minY, Math.min(0, panY));
    }
    function apply(){
      currentTargets().forEach(function(img){
        img.style.transformOrigin = "0 0";
        img.style.transform = scale === 1 ? "" : "translate(" + panX + "px," + panY + "px) scale(" + scale + ")";
      });
      zoomScale = scale;
      if(track) track.style.overflowX = scale > 1.01 ? "hidden" : "";
      media.classList.toggle("is-zoomed", scale > 1.01);
    }
    function reset(){ scale = 1; panX = 0; panY = 0; apply(); }
    function zoomAt(lp, s1){
      panX = lp.x * (1 - s1);
      panY = lp.y * (1 - s1);
      scale = s1;
      clamp();
      apply();
    }

    if(track){
      track.addEventListener("scroll", function(){ if(scale > 1.01) reset(); });
    }

    function dist(p1, p2){ return Math.hypot(p1.x - p2.x, p1.y - p2.y); }
    function mid(p1, p2){ return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }; }

    media.addEventListener("pointerdown", function(e){
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pointers);
      if(ids.length === 2){
        var p1 = pointers[ids[0]], p2 = pointers[ids[1]];
        var m = mid(p1, p2);
        pinchStart = { dist: dist(p1, p2) || 1, scale: scale, panX: panX, panY: panY, mid: localPoint(m.x, m.y) };
        panStart = null;
      }else if(ids.length === 1){
        if(scale > 1.01){
          panStart = { x: e.clientX, y: e.clientY, panX: panX, panY: panY };
        }
        media.__tapStart = { x: e.clientX, y: e.clientY };
      }
    });
    media.addEventListener("pointermove", function(e){
      if(!(e.pointerId in pointers)) return;
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pointers);
      if(ids.length >= 2 && pinchStart){
        e.preventDefault();
        var p1 = pointers[ids[0]], p2 = pointers[ids[1]];
        var s1 = Math.max(1, Math.min(4, pinchStart.scale * (dist(p1, p2) / pinchStart.dist)));
        panX = pinchStart.mid.x - (pinchStart.mid.x - pinchStart.panX) * (s1 / pinchStart.scale);
        panY = pinchStart.mid.y - (pinchStart.mid.y - pinchStart.panY) * (s1 / pinchStart.scale);
        scale = s1;
        clamp();
        apply();
      }else if(ids.length === 1 && panStart){
        e.preventDefault();
        panX = panStart.panX + (e.clientX - panStart.x);
        panY = panStart.panY + (e.clientY - panStart.y);
        clamp();
        apply();
      }
    }, { passive: false });
    function endPointer(e){
      var hadPinch = !!pinchStart;
      delete pointers[e.pointerId];
      var remaining = Object.keys(pointers).length;
      if(remaining < 2) pinchStart = null;
      if(remaining < 1) panStart = null;

      if(!hadPinch && remaining === 0){
        var ts = media.__tapStart;
        if(ts && Math.abs(e.clientX - ts.x) < 10 && Math.abs(e.clientY - ts.y) < 10){
          var now = Date.now();
          if(now - lastTapTime < 320 && Math.abs(ts.x - lastTapX) < 30 && Math.abs(ts.y - lastTapY) < 30){
            if(scale > 1.01){ reset(); }
            else{ zoomAt(localPoint(ts.x, ts.y), 2.5); }
            lastTapTime = 0;
          }else{
            lastTapTime = now; lastTapX = ts.x; lastTapY = ts.y;
          }
        }
      }
    }
    media.addEventListener("pointerup", endPointer);
    media.addEventListener("pointercancel", function(e){
      delete pointers[e.pointerId];
      pinchStart = null; panStart = null;
    });
  }

  function openLightbox(idx, photoIdx){
    var item = (itemListEl.__list||[])[idx];
    if(!item) return;
    zoomScale = 1;
    multiTouchCount = 0;
    var wrap = document.getElementById("lbCompare");
    wrap.innerHTML = mediaMarkup(item, "cmp-contain", "lightbox");
    // Unhide before measuring anything below — a [hidden] (display:none)
    // element and its children report 0 for all layout sizes, which would
    // make the scroll-position and height calculations below silently fail.
    lightbox.hidden = false;
    document.body.style.overflow = "hidden";
    // Land on whichever photo was already showing in the card's own gallery,
    // instead of always resetting back to the first photo — done before
    // wiring so the gallery's own initial dot/counter/fit already reflect it.
    if(photoIdx){
      var openGal = wrap.querySelector(".gallery");
      if(openGal){
        var openTrack = openGal.querySelector(".gal-track");
        var openImgs = openTrack.querySelectorAll("img");
        var target = openImgs[photoIdx];
        if(target){
          openTrack.scrollLeft = target.offsetLeft + target.offsetWidth / 2 - openTrack.clientWidth / 2;
        }
      }
    }
    wireCompare(wrap);
    wireGallery(wrap);
    wireZoom(wrap);
    // Before/after and single-photo views don't swap images per swipe, so
    // their height only needs fitting once, to whichever photo loads first.
    var containBox = wrap.querySelector(".compare.cmp-contain");
    if(containBox){
      var fitImg = containBox.querySelector(".cmp-before") || containBox.querySelector("img");
      if(fitImg){
        if(fitImg.complete && fitImg.naturalWidth){
          fitContainHeight(containBox, fitImg);
        }else{
          fitImg.addEventListener("load", function(){ fitContainHeight(containBox, fitImg); }, { once:true });
        }
      }
    }
    document.getElementById("lbCat").textContent = item.category || "";
    document.getElementById("lbTitle").textContent = item.item_name || "";
    document.getElementById("lbRemark").textContent = item.remark || "";
  }

  // Re-fit the open lightbox's media box on orientation change / window resize.
  window.addEventListener("resize", function(){
    if(lightbox.hidden) return;
    var wrap = document.getElementById("lbCompare");
    var containBox = wrap.querySelector(".compare.cmp-contain");
    if(containBox){
      var fitImg = containBox.querySelector(".cmp-before") || containBox.querySelector("img");
      if(fitImg && fitImg.naturalWidth) fitContainHeight(containBox, fitImg);
    }
    var gal = wrap.querySelector(".gallery.gal-contain");
    if(gal){
      var track = gal.querySelector(".gal-track");
      var imgs = track.querySelectorAll("img");
      var target = track.scrollLeft + track.clientWidth / 2;
      var best = imgs[0], bestDist = Infinity;
      imgs.forEach(function(img){
        var center = img.offsetLeft + img.offsetWidth / 2;
        var d = Math.abs(center - target);
        if(d < bestDist){ bestDist = d; best = img; }
      });
      if(best && best.naturalWidth) fitContainHeight(gal, best);
    }
  });

  function closeLightbox(){
    lightbox.hidden = true;
    document.body.style.overflow = "";
    var content = lightbox.querySelector(".lb-content");
    if(content){ content.style.transition = ""; content.style.transform = ""; content.style.opacity = ""; }
    lightbox.style.background = "";
    zoomScale = 1;
    multiTouchCount = 0;
  }

  // Tracks how many fingers are currently down inside the lightbox, in the capture
  // phase so it's accurate before wireCompare/wireGallery/wireZoom's own (bubble
  // phase) listeners on the same event run.
  lightbox.addEventListener("pointerdown", function(){ multiTouchCount++; }, true);
  lightbox.addEventListener("pointerup", function(){ multiTouchCount = Math.max(0, multiTouchCount - 1); }, true);
  lightbox.addEventListener("pointercancel", function(){ multiTouchCount = Math.max(0, multiTouchCount - 1); }, true);

  document.getElementById("lbClose").addEventListener("click", closeLightbox);

  // Swipe down to close: only engages when the lightbox is already scrolled to the
  // top (so it never fights with scrolling down to read a long remark), and only
  // for a gesture that starts out mostly vertical/downward (so it doesn't fight
  // with the before/after drag or the multi-photo horizontal swipe).
  (function(){
    var drag = null; // null | {startX, startY, state}
    lightbox.addEventListener("pointerdown", function(e){
      if(lightbox.hidden || lightbox.scrollTop > 0 || zoomActive()){ drag = null; return; }
      drag = { startX: e.clientX, startY: e.clientY, state: "pending" };
    });
    lightbox.addEventListener("pointermove", function(e){
      if(!drag) return;
      if(zoomActive()){ drag = null; return; }
      var dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
      if(drag.state === "pending"){
        if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        drag.state = (dy > 0 && dy > Math.abs(dx)) ? "closing" : "ignore";
      }
      if(drag.state === "closing"){
        e.preventDefault();
        var content = lightbox.querySelector(".lb-content");
        var dist = Math.max(0, dy);
        if(content){
          content.style.transition = "none";
          content.style.transform = "translateY(" + dist + "px)";
          content.style.opacity = String(Math.max(0.35, 1 - dist / 400));
        }
      }
    }, { passive: false });
    function endLbDrag(e){
      if(!drag) return;
      if(drag.state === "closing"){
        var dy = e.clientY - drag.startY;
        var content = lightbox.querySelector(".lb-content");
        if(dy > 90){
          closeLightbox();
        }else if(content){
          content.style.transition = "transform .2s ease, opacity .2s ease";
          content.style.transform = "";
          content.style.opacity = "";
        }
      }
      drag = null;
    }
    lightbox.addEventListener("pointerup", endLbDrag);
    lightbox.addEventListener("pointercancel", endLbDrag);
  })();

  function goBackToList(){
    viewStore.hidden = true;
    viewPrice.hidden = true;
    viewMap.hidden = true;
    viewList.hidden = false;
    window.scrollTo(0,0);
  }

  // Both the back button and the swipe gesture below just ask the browser to
  // go back; the actual view switch happens in the popstate handler further
  // down, which is also what fires for the browser's own back gestures
  // (trackpad two-finger swipe, iOS edge-swipe, Android back button).
  document.getElementById("backBtn").addEventListener("click", function(){ history.back(); });
  document.getElementById("priceBackBtn").addEventListener("click", function(){ history.back(); });
  document.getElementById("priceListBtn").addEventListener("click", openPriceList);
  document.getElementById("mapBackBtn").addEventListener("click", function(){ history.back(); });
  document.getElementById("machineMapBtn").addEventListener("click", openMachineMap);
  document.getElementById("mapDetailClose").addEventListener("click", closeMapDetail);

  // Phone map gestures: pinch to zoom (around the fingers), drag to move
  // once zoomed in. A drag never counts as a tap on a box or on the map.
  (function(){
    var wrap = document.getElementById("mapCanvasWrap");
    var g = null, justDragged = false;
    function pt(t){ var w = wrap.getBoundingClientRect(); return {x: t.clientX - w.left, y: t.clientY - w.top}; }
    function begin(e){
      if (!isPhoneMap()) { g = null; return; }
      if (e.touches.length >= 2) {
        var a = pt(e.touches[0]), b = pt(e.touches[1]);
        g = {mode: "pinch", d: Math.hypot(a.x - b.x, a.y - b.y) || 1, s: mapZoom.s,
             mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, tx: mapZoom.tx, ty: mapZoom.ty, moved: true};
      } else if (e.touches.length === 1 && mapZoom.s > 1) {
        var p0 = pt(e.touches[0]);
        g = {mode: "pan", x: p0.x, y: p0.y, tx: mapZoom.tx, ty: mapZoom.ty, moved: false};
      } else {
        g = null;
      }
    }
    wrap.addEventListener("touchstart", begin, {passive: true});
    wrap.addEventListener("touchmove", function(e){
      if (!g) return;
      if (g.mode === "pinch" && e.touches.length >= 2) {
        e.preventDefault();
        var a = pt(e.touches[0]), b = pt(e.touches[1]);
        var d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
        var s = Math.max(1, Math.min(MAP_ZOOM_MAX, g.s * d / g.d));
        var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        // the drawing point that was under the fingers stays under them
        var lx = (g.mx - g.tx) / g.s, ly = (g.my - g.ty) / g.s;
        mapZoom.s = s; mapZoom.tx = mx - lx * s; mapZoom.ty = my - ly * s;
        clampMapZoom();
      } else if (g.mode === "pan" && e.touches.length === 1) {
        var p = pt(e.touches[0]);
        var dx = p.x - g.x, dy = p.y - g.y;
        if (!g.moved && Math.hypot(dx, dy) < 6) return;
        g.moved = true;
        e.preventDefault();
        mapZoom.tx = g.tx + dx; mapZoom.ty = g.ty + dy;
        clampMapZoom();
      }
    }, {passive: false});
    function end(e){
      if (!g) return;
      if (g.moved) justDragged = true;
      // lifting one finger of a pinch carries on as a drag with the other
      if (e.touches.length === 1 && g.mode === "pinch") { begin(e); if (g) g.moved = true; }
      else if (!e.touches.length) g = null;
    }
    wrap.addEventListener("touchend", end);
    wrap.addEventListener("touchcancel", end);
    // swallow the click that a drag/pinch would otherwise produce
    wrap.addEventListener("click", function(e){
      if (justDragged) { justDragged = false; e.stopPropagation(); e.preventDefault(); }
    }, true);
    wrap.addEventListener("touchstart", function(){ justDragged = false; }, {passive: true, capture: true});
  })();
  // Phone: drag the sheet down to dismiss it (only when it's scrolled to
  // its top, so a normal scroll inside a long sheet isn't mistaken for it).
  (function(){
    var sheet = document.getElementById("mapDetailSheet");
    var startY = null, dy = 0;
    sheet.addEventListener("touchstart", function(e){
      if (window.matchMedia("(min-width:720px)").matches || sheet.scrollTop > 0) { startY = null; return; }
      startY = e.touches[0].clientY; dy = 0;
      sheet.classList.add("is-dragging");
    }, {passive:true});
    sheet.addEventListener("touchmove", function(e){
      if (startY === null) return;
      dy = Math.max(0, e.touches[0].clientY - startY);
      sheet.style.transform = dy ? "translateY(" + dy + "px)" : "";
    }, {passive:true});
    function end(){
      if (startY === null) return;
      startY = null;
      sheet.classList.remove("is-dragging");
      // dragged far enough: slide out from where the finger left it;
      // otherwise spring back up
      if (dy > 70) closeMapDetail(); else sheet.style.transform = "";
    }
    sheet.addEventListener("touchend", end);
    sheet.addEventListener("touchcancel", end);
  })();
  // A click/tap on the map that isn't on a box. On a phone, boxes are small
  // for a fingertip, so a tap that lands just beside one (within ~8px of
  // its edge) still picks the nearest box. Otherwise — a genuinely empty
  // spot — it closes the detail panel (on PC the map stays clickable while
  // the panel is open).
  document.getElementById("mapCanvas").addEventListener("click", function(e){
    if (e.target.closest(".map-equip")) return;
    if (isPhoneMap()) {
      var best = -1, bestD = 8;
      document.querySelectorAll("#mapCanvas .map-equip").forEach(function(el){
        var r = el.getBoundingClientRect();
        var dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
        var dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
        var d = Math.hypot(dx, dy);
        if (d < bestD) { bestD = d; best = parseInt(el.getAttribute("data-idx"), 10); }
      });
      if (best >= 0) { selectMapEquip(best, "map"); return; }
    }
    if (!document.getElementById("mapDetail").hidden) closeMapDetail();
  });

  // Phone: double-tap the map to zoom in there (2.5×); double-tap again to
  // go back to the whole map.
  (function(){
    var wrap = document.getElementById("mapCanvasWrap");
    var t0 = null, last = null;
    wrap.addEventListener("touchstart", function(e){
      t0 = (e.touches.length === 1) ? {x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now()} : null;
    }, {passive: true});
    wrap.addEventListener("touchend", function(e){
      if (!t0 || e.changedTouches.length !== 1 || !isPhoneMap()) { t0 = null; return; }
      var p = e.changedTouches[0];
      var isTap = Math.hypot(p.clientX - t0.x, p.clientY - t0.y) < 10 && Date.now() - t0.t < 300;
      t0 = null;
      if (!isTap) { last = null; return; }
      var now = Date.now();
      if (last && now - last.t < 320 && Math.hypot(p.clientX - last.x, p.clientY - last.y) < 30) {
        last = null;
        var w = wrap.getBoundingClientRect();
        glideMap();
        if (mapZoom.s < 1.5) zoomMapAt(2.5, p.clientX - w.left, p.clientY - w.top);
        else resetMapZoom();
      } else {
        last = {x: p.clientX, y: p.clientY, t: now};
      }
    });
  })();
  document.getElementById("mapDetailBackdrop").addEventListener("click", closeMapDetail);

  // Swipe right to go back to the store list — touch only, and not when the
  // gesture starts on something that already scrolls/drags horizontally
  // itself (the photo gallery, before/after compare, chip rows, date picker,
  // type tabs), so it never steals their swipe.
  (function(){
    var drag = null; // null | {startX, startY, state}
    var EXCLUDE = ".gallery, .compare, .date-picker, .type-tabs, .chips";
    viewStore.addEventListener("pointerdown", function(e){
      if(e.pointerType === "mouse" || viewStore.hidden || !lightbox.hidden){ drag = null; return; }
      if(e.target.closest && e.target.closest(EXCLUDE)){ drag = null; return; }
      drag = { startX: e.clientX, startY: e.clientY, state: "pending" };
    });
    viewStore.addEventListener("pointermove", function(e){
      if(!drag) return;
      var dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
      if(drag.state === "pending"){
        if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        drag.state = (dx > 0 && dx > Math.abs(dy)) ? "swiping" : "ignore";
      }
      if(drag.state === "swiping"){
        e.preventDefault();
        var dist = Math.max(0, dx);
        viewStore.style.transition = "none";
        viewStore.style.transform = "translateX(" + dist + "px)";
        viewStore.style.opacity = String(Math.max(0.4, 1 - dist / 500));
      }
    }, { passive: false });
    function endSwipe(e){
      if(!drag) return;
      if(drag.state === "swiping"){
        var dx = e.clientX - drag.startX;
        if(dx > 90){
          viewStore.style.transition = "";
          viewStore.style.transform = "";
          viewStore.style.opacity = "";
          history.back();
        }else{
          viewStore.style.transition = "transform .2s ease, opacity .2s ease";
          viewStore.style.transform = "";
          viewStore.style.opacity = "";
        }
      }
      drag = null;
    }
    viewStore.addEventListener("pointerup", endSwipe);
    viewStore.addEventListener("pointercancel", endSwipe);
  })();

  // ---- staying on the same page across a reload ----
  // Each history entry carries what's on screen (which page, store, floor,
  // visit date/filters, scroll position). It's written into the current
  // entry just before leaving it — moving to another page, reloading,
  // closing or backgrounding the tab — so a reload (which keeps the entry)
  // or the back button reopens exactly that page where it was left.
  function currentViewName(){
    if (!viewMap.hidden) return "map";
    if (!viewPrice.hidden) return "price";
    if (!viewStore.hidden) return "store";
    return "list";
  }
  function saveViewState(){
    if (!dataReady) return;   // still loading: keep whatever the entry already says
    var v = currentViewName();
    var st = {view: v, scrollY: Math.round(window.scrollY || 0)};
    if (v === "store" || v === "map") st.storeId = currentStore;
    if (v === "map") st.floor = currentMapFloor;
    if (v === "store") { st.date = currentDate; st.type = currentTypeFilter; st.cat = currentCatFilter; }
    try { history.replaceState(st, "", location.href); } catch(e) {}
  }
  function stateFromHash(){
    var h = location.hash || "", m;
    if ((m = h.match(/^#store=(.+)$/))) return {view: "store", storeId: decodeURIComponent(m[1])};
    if ((m = h.match(/^#map=(.+)$/))) return {view: "map", storeId: decodeURIComponent(m[1])};
    if (h === "#price") return {view: "price"};
    return {view: "list"};
  }
  // Show the page an entry describes, then put the scroll back.
  function restoreView(st){
    st = st || {view: "list"};
    var known = function(id){ return STORES.some(function(s){ return s.store_id === id; }); };
    if (st.view === "store" && known(st.storeId)) {
      showStoreView(st.storeId, st);
    } else if (st.view === "price") {
      showPriceView();
    } else if (st.view === "map" && known(st.storeId)) {
      if (st.floor) currentMapFloor = st.floor;
      showMapView(st.storeId);
    } else {
      goBackToList();
    }
    if (st.scrollY) {
      var y = st.scrollY;
      requestAnimationFrame(function(){ window.scrollTo(0, y); });
    }
  }
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  window.addEventListener("pagehide", saveViewState);
  window.addEventListener("beforeunload", saveViewState);
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "hidden") saveViewState();
  });

  // Which page to open once the data is in: after a reload, the entry still
  // holds its state; a fresh visit to a link like …#store=xxx is read from
  // the URL. In that fresh case the list goes underneath as the base entry,
  // so "back" from the linked page still lands on the store list.
  var dataReady = false;
  var bootState = (history.state && history.state.view) ? history.state : stateFromHash();
  if (!history.state || !history.state.view) {
    var bootUrl = location.pathname + location.search + location.hash;
    history.replaceState({view: "list"}, "", location.pathname + location.search);
    if (bootState.view !== "list") history.pushState(bootState, "", bootUrl);
  }

  window.addEventListener("popstate", function(e){
    // Leaving (or re-entering) the map never keeps an old detail panel open.
    if (!document.getElementById("mapDetail").hidden) closeMapDetail();
    restoreView(e.state);
  });

  loadData();
})();
</script>
</body>
</html>
